        Receives an incoming federation message for the named airdress.
        Auth model deferred to SPEC-008.
      tags: [federation]
      x-status: deferred-to-federation-auth
      security:
        - federationAuth: []
      parameters:
        - name: airdress
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
