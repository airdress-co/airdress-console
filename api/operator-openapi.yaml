  # ── Plugin installs ──────────────────────────────────────────────────────

  /v1/plugins/installs:
    get:
      operationId: plugins_list_installs
      summary: List plugin installs
      description: "Every install on the owner's airdress, with its runtime state and plugin-db access. Owner only."
      tags: [plugins]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginInstall'
        '401':
          description: "No owner OIDC token, or one that did not verify."
        '403':
          description: "A valid token for someone other than the owner."
    post:
      operationId: plugins_create_install
      summary: Install a plugin
      description: "Installs an app on the owner's airdress, from a loaded definition or from a signed registry release (SPEC-002 FR-I1..I5). A manifest the host could not start is refused here, never at the first request. Idempotent for the same app on the same subdomain; a re-install keeps the install id. `?dry_run=true` validates — for a release, everything but the artifact's bytes — and returns the consent summary without persisting or downloading. Owner only."
      tags: [plugins]
      security:
        - ownerAuth: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInstallRequest'
      responses:
        '201':
          description: "Installed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstall'
        '401':
          description: "No owner OIDC token, or one that did not verify."
        '403':
          description: "A valid token for someone other than the owner."
        '400':
          description: "Neither or both of `app_type` and `plugin`, `version` without `plugin`, or `signers` that is not a set (`signers_invalid`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '404':
          description: "No loaded definition with that `app_type`, or no such plugin or version in the registry."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '409':
          description: "The subdomain holds a different app, or the release is yanked (`version_yanked`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '422':
          description: "The config does not match the app's `config` schema; the manifest could not start as written (`code` says why); or the release is unsigned, not signed by a member of the install's signer set, signed by a revoked author key, without the build provenance this operator requires, or does not match the digests its signed `artifacts.yaml` pins (`code` and `step` say which)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '502':
          description: "The registry could not be reached, or its index is unsigned, not signed by a pinned index key, expired, or older than one already seen (`index_*`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '503':
          description: "The machine registry or the revocation store could not be read to check the signer set (`signers_unavailable`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '424':
          description: "The app needs plugin-db access and this operator has none."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'

  /v1/plugin-grants:
    post:
      operationId: plugin_grants_create
      summary: Grant access to a plugin resource
      description: "A grant on one resource of one install (SPEC-119 S2). Only its governor may make one: the person whose namespace it is (`person:<id>`, the default), or the airdress owner for the install's own (`install:<InstallId>`). The owner may be a grantee of a person's grant but never grants on a person's data. Actions are `ReadData`, `WriteData` and the plugin's own declared `<plugin>/<verb>`; `WriteData` does not imply `ReadData`."
      tags: [plugins]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginGrantRequest'
      responses:
        '201':
          description: "Granted."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginGrant'
        '400':
          description: "`unknown_field` or `bad_request`."
        '401':
          description: "No valid credential."
        '403':
          description: "`not_governor`: the caller does not govern that namespace; `person_required`: a machine."
        '404':
          description: "`install_not_found`."
        '409':
          description: "`grant_exists`: a live grant already covers that grantee on that resource."
        '422':
          description: "`unknown_type`, `scope_not_declared` or `action_not_declared`."
    get:
      operationId: plugin_grants_list
      summary: List grants on what the caller governs
      description: "Grants on the caller's own personal namespace on every install and, for the airdress owner, on each install's own namespace."
      tags: [plugins]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: install
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginGrant'
        '401':
          description: "No valid credential."

  /v1/plugin-grants/{id}:
    delete:
      operationId: plugin_grants_revoke
      summary: Revoke a grant on a plugin resource
      description: "Only the resource's governor may revoke; to anyone else the grant does not exist (`404`)."
      tags: [plugins]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: "Revoked."
        '401':
          description: "No valid credential."
        '404':
          description: "`grant_not_found`."

  /_airdress/plugin-signin/callback:
    get:
      operationId: plugin_signin_callback
      summary: Browser sign-in on a plugin subdomain, the issuer's redirect back
      description: "Where the operator's issuer returns a browser that began signing in at `https://<app>.<airdress>/_airdress/signin` (owner ruling OQ-7). Exchanges the code with the PKCE verifier, resolves the account to the owner or an OIDC-bound sub-user, and redirects to the plugin subdomain the sign-in began on with a single-use hand-off code. Needs `[apps.sessions] oidc_client_id`."
      tags: [plugins]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: "To `https://<plugin host>/_airdress/session?code=…`."
        '400':
          description: "A missing, expired or replayed state, or a refused code exchange."
        '403':
          description: "The account has no principal on this airdress."
        '404':
          description: "Browser sign-in is not configured."

  /_airdress/plugins/{sub}/authorize:
    get:
      operationId: plugin_consent_page
      summary: The consent page for a plugin's personal scope
      description: "The page a `403 plugin_not_authorized` names in `authorizationUrl`, on the airdress's own origin and never the plugin's (SPEC-119 119-C.8). HTML. Without a session on the airdress (cookie `__Host-airdress-consent`, never the plugin subdomain's), signs the browser in and comes back. With one, shows the plugin, its version, what its personal scope asks for and who is signed in, with a single-use CSRF token bound to the session, the install and the scope digest shown. Refuses to be framed."
      tags: [plugins]
      security: []
      parameters:
        - name: sub
          in: path
          required: true
          description: "The install's subdomain."
          schema:
            type: string
        - name: return
          in: query
          required: false
          description: "A path on the plugin's subdomain to link back to."
          schema:
            type: string
      responses:
        '200':
          description: "The page: authorize, already authorized (revoke), not offered, or nothing to authorize."
        '302':
          description: "To the issuer, to sign in."
        '401':
          description: "Browser sign-in is not configured."
        '404':
          description: "No install on that subdomain."
    post:
      operationId: plugin_consent_submit
      summary: Authorize or revoke a plugin's personal scope from the consent page
      description: "A form from the consent page itself: `csrf`, `action` (`authorize` or `revoke`), `data` (`keep` or `erase`, for revoke), `return`. Accepted only with `Origin` the airdress's own origin (or `Sec-Fetch-Site: same-origin`), as a navigation the person started (`Sec-Fetch-Mode: navigate`, `Sec-Fetch-Dest: document`, `Sec-Fetch-User: ?1`, when sent), with an unspent token issued to this session for this install. A form on a plugin's origin is refused. Records the same authorization as `POST /v1/plugins/installs/{id}/authorizations`."
      tags: [plugins]
      security: []
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf:
                  type: string
                action:
                  type: string
                  enum: [authorize, revoke]
                data:
                  type: string
                  enum: [keep, erase]
                return:
                  type: string
      responses:
        '200':
          description: "Done: authorized, or revoked."
        '400':
          description: "An unknown action or data choice."
        '401':
          description: "No session on the airdress."
        '403':
          description: "Not from the consent page: another origin, not a person's own navigation, or a missing, spent, expired or foreign token."
        '409':
          description: "The scope changed since the page was shown, or it is not offered or declared; the page again."

  /v1/plugins/installs/{id}:
    get:
      operationId: plugins_get_install
      summary: Get a plugin install
      description: "One install, with its runtime state and plugin-db access (role, schema, capability; never a password). Owner only."
      tags: [plugins]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstall'
        '401':
          description: "No owner OIDC token, or one that did not verify."
        '403':
          description: "A valid token for someone other than the owner."
        '404':
          description: "Not installed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
    patch:
      operationId: plugins_update_install
      summary: Enable or disable a plugin install, or set its config
      description: "Disabling stops the instance and keeps its row and data. A new `config` is validated against the app's schema and stops a running instance so the next request starts it on the new config. Owner only."
      tags: [plugins]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInstallPatch'
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstall'
        '401':
          description: "No owner OIDC token, or one that did not verify."
        '403':
          description: "A valid token for someone other than the owner."
        '404':
          description: "Not installed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '422':
          description: "The config does not match the app's `config` schema."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
    delete:
      operationId: plugins_delete_install
      summary: Uninstall a plugin
      description: "Destroys the install's data; requires `?purge=true`. `?backup=true` dumps its plugin-db schema first. Owner only."
      tags: [plugins]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: purge
          in: query
          required: true
          schema:
            type: boolean
        - name: backup
          in: query
          required: false
          schema:
            type: boolean
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '204':
          description: "Uninstalled."
        '401':
          description: "No owner OIDC token, or one that did not verify."
        '403':
          description: "A valid token for someone other than the owner."
        '400':
          description: "`?purge=true` is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'
        '404':
          description: "Not installed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallError'

  # ── Ingest ───────────────────────────────────────────────────────────────

  /ingest/v1/{slug}:
    post:
      operationId: ingest_post_event
      summary: Ingest an event
      description: Accepts a CloudEvents-format event on the named ingest endpoint. No auth required.
      tags: [ingest]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Event accepted.
        '400':
          description: Invalid event.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Ingest endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /ingest/v1/events:
    get:
      operationId: ingest_get_events
      summary: Ingest event stream
      description: SSE stream of incoming ingest events.
      tags: [ingest]
      x-sse: true
      security:
        - ownerAuth: []
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /ingest/v1/events/list:
    get:
      operationId: ingest_get_events_list
      summary: List ingest events
      description: Returns a paginated list of ingested events.
      tags: [ingest]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: List of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestEventList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /ingest/v1/events/{event_id}:
    get:
      operationId: ingest_get_event
      summary: Get an ingest event
      description: Returns a single ingest event by ID.
      tags: [ingest]
      security:
        - ownerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestEvent'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Event not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /ingest/v1/endpoints:
    get:
      operationId: ingest_get_endpoints
      summary: List ingest endpoints
      description: Returns all configured ingest endpoints.
      tags: [ingest]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: List of ingest endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestEndpointList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /ingest/v1/endpoints/{slug}/metrics:
    get:
      operationId: ingest_get_endpoint_metrics
      summary: Get endpoint metrics
      description: Returns metrics for a specific ingest endpoint.
      tags: [ingest]
      security:
        - ownerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Endpoint metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointMetrics'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ── Admin ────────────────────────────────────────────────────────────────

  /admin/dns/validate:
    post:
      operationId: admin_post_dns_validate
      summary: Validate DNS configuration
      description: Validates DNS configuration for a domain.
      tags: [admin]
      x-internal: true
      security:
        - adminLocal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsValidateRequest'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsValidateResponse'
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/dns/validate/batch:
    post:
      operationId: admin_post_dns_validate_batch
      summary: Batch validate DNS configurations
      description: Validates multiple DNS configurations in one request.
      tags: [admin]
      x-internal: true
      security:
        - adminLocal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsValidateBatchRequest'
      responses:
        '200':
          description: Batch validation results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsValidateBatchResponse'
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/tls/renew:
    post:
      operationId: admin_post_tls_renew
      summary: Renew TLS certificate
      description: |
        Starts a TLS certificate renewal job for a domain (202 with the
        job). Host-local admin listener only, with the admin credential.
      tags: [admin]
      x-internal: true
      security:
        - adminLocal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TlsRenewRequest'
      responses:
        '200':
          description: Renewal result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRenewResponse'
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/tls/renew/{id}:
    get:
      operationId: admin_get_tls_renew_job
      summary: A TLS renewal job
      description: The state of one renewal job. Host-local admin listener only, with the admin credential.
      tags: [admin]
      x-internal: true
      security:
        - adminLocal: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRenewResponse'
        '404':
          description: No such job.

  /v1/tls/renew:
    post:
      operationId: tls_post_owner_renew
      summary: Renew this airdress's TLS certificate
      description: |
        Owner-only (the owner's OIDC bearer, then Cedar `Apply` on
        `Airdress::<fqdn>`). Starts a renewal job for this operator's own
        airdress; the name cannot be chosen. At most one start per 10
        minutes and six per 24 hours (429 with Retry-After); 409 carries
        the id of a job already running. Every start and refusal is a
        journal event.
      tags: [tls]
      security:
        - ownerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rotate:
                  type: boolean
                  description: Revoke the serving certificate before reissuing.
      responses:
        '202':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRenewResponse'
        '401':
          description: Not the owner.
        '403':
          description: Refused by policy.
        '409':
          description: A renewal is already running.
        '429':
          description: Rate limited.

  /v1/tls/renew/{id}:
    get:
      operationId: tls_get_owner_renew_job
      summary: A TLS renewal job
      description: The state of one renewal job, for the owner.
      tags: [tls]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRenewResponse'
        '401':
          description: Not the owner.
        '404':
          description: No such job.

  # ── SPEC-042 — sub-user admin + /v1/me ───────────────────────────

  /v1/admin/sub-users:
    post:
      operationId: principals_post_sub_users
      summary: Mint a sub-user
      description: |
        Owner-only. Mints a new sub-user principal and returns its
        bearer token once. Sub-users get 403 with
        `error.code = "sub_user_forbidden"` on this endpoint.
      tags: [principals]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubUserRequest'
      responses:
        '201':
          description: Sub-user created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubUserResponse'
        '400':
          description: Invalid display_name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sub-user is not allowed to call admin endpoints.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: display_name already in use.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: principals_list_sub_users
      summary: List active sub-users
      description: |
        Owner-only. Returns the active sub-users on this operator with
        timestamps. Bearer tokens are never surfaced (mint-once at
        create time only).
      tags: [principals]
      security:
        - ownerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Active sub-users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubUserSummary'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sub-user is not allowed to call admin endpoints.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/sub-users/{id}:
    delete:
      operationId: principals_revoke_sub_user
      summary: Revoke a sub-user
      description: |
        Owner-only. Idempotent — already-revoked principals return 204
        without error. Revocation is immediately consistent: the next
        request bearing the revoked token returns 401.
      tags: [principals]
      security:
        - ownerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked.
        '401':
          description: Unauthorized.
        '403':
          description: Sub-user is not allowed to call admin endpoints.

  /v1/admin/sub-users/{id}/publication-block:
    put:
      operationId: principals_block_publication
      summary: Block a sub-user's publishing
      description: |
        Owner-only. Turns this person's name and photo off and keeps them
        off until the block is lifted; the person may not turn it back on.
        Unpublishes in the same transaction. Idempotent. The person is told
        on their devices (`publication_block_changed`).
      tags: [principals]
      security:
        - ownerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Blocked.
        '401':
          description: Unauthorized.
        '403':
          description: Sub-user is not allowed to call admin endpoints.
        '404':
          description: No such sub-user.
        '409':
          description: The owner cannot be blocked (`not_a_sub_user`).
    delete:
      operationId: principals_lift_publication_block
      summary: Lift the block on a sub-user's publishing
      description: |
        Owner-only. Hands the switch back to the person. **Publishes
        nothing**: they are still unpublished afterwards and publish again
        only by their own act, so no verb on this resource can produce a
        published state. Idempotent.
      tags: [principals]
      security:
        - ownerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Lifted.
        '401':
          description: Unauthorized.
        '403':
          description: Sub-user is not allowed to call admin endpoints.
        '404':
          description: No such sub-user.
        '409':
          description: The owner cannot be blocked (`not_a_sub_user`).
  /v1/admin/sub-users/{id}/metadata:
    get:
      operationId: principals_sub_user_metadata
      summary: Sub-user chat metadata
      description: |
        Owner-only. Returns conversation metadata (counterparty,
        timestamps, message counts) for the sub-user's chats. NEVER
        includes message content or any decryption attempt — owner is
        admin, not a reader (SPEC-042 strict-isolation NFR-1).
      tags: [principals]
      security:
        - ownerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMetadata'
        '401':
          description: Unauthorized.
        '403':
          description: Sub-user is not allowed to call admin endpoints.
        '404':
          description: Sub-user not found.

  /v1/admin/principals/bind:
    post:
      operationId: principals_bind
      summary: Bind a sub-user to an OIDC identity
      description: |
        SPEC-045 hub-mediated sub-user binding. Owner-only. Creates a
        sub-user principal whose only credential is the OIDC pair
        `(oidc_issuer, oidc_sub)`; the principal authenticates via
        ZITADEL JWT on subsequent requests. Idempotent on
        `(oidc_issuer, oidc_sub)` — repeated calls return 200 with
        `created: false`.
      tags: [principals]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oidc_sub, oidc_issuer, display_name, role]
              properties:
                oidc_sub:
                  type: string
                  description: ZITADEL `sub` claim of the principal to bind.
                oidc_issuer:
                  type: string
                  description: ZITADEL issuer URL.
                display_name:
                  type: string
                  description: Display name shown to other principals.
                role:
                  type: string
                  enum: [sub_user]
                  description: Only `sub_user` is accepted; owner is provisioned by bootstrap.
      responses:
        '200':
          description: Principal already bound — idempotent re-bind.
          content:
            application/json:
              schema:
                type: object
                required: [id, created]
                properties:
                  id:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                    enum: [false]
        '201':
          description: Principal created and bound.
          content:
            application/json:
              schema:
                type: object
                required: [id, created]
                properties:
                  id:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                    enum: [true]
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized.
        '403':
          description: Sub-user is not allowed to call admin endpoints.

  /v1/me:
    get:
      operationId: principals_get_me
      summary: Self view
      description: |
        Returns the calling principal's own row. Reachable by any
        authenticated principal (owner or sub-user). Sub-users only
        ever see their own data; the operator's strict-isolation
        invariant means there is no cross-principal read path.
      tags: [principals]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: Self view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '401':
          description: Unauthorized.
    patch:
      operationId: principals_patch_me
      summary: Update self display name and public name
      description: |
        Sub-user (or owner) updates their own `display_name`, the name they
        go by in public (`published_name`), or both. Returns 409 on
        collision with another active principal's `display_name`; the public
        name is deliberately not unique.
      tags: [principals]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          description: Updated self view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '400':
          description: Invalid display_name or published_name, or nothing to change.
        '401':
          description: Unauthorized.
        '409':
          description: display_name already in use.
  /v1/me/publication:
    get:
      operationId: principals_get_publication
      summary: What the world may see of the caller
      description: |
        The caller's own publishing switch, whether the owner has blocked
        it, and the name and photo that are or would be shown. Publishing is
        each person's own decision: it used to be one switch per airdress,
        which every sub-user shares with the owner.
      tags: [principals]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The caller's publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationView'
        '401':
          description: Unauthorized.
    put:
      operationId: principals_publish_self
      summary: Publish the caller
      description: |
        Turns the caller's own switch on. Idempotent. The request carries no
        path parameter, body or query, so it can only ever publish the
        caller. Refused with code `publication_blocked` while the owner's
        block stands.
      tags: [principals]
      security:
        - ownerAuth: []
      responses:
        '204':
          description: Published.
        '401':
          description: Unauthorized.
        '403':
          description: The owner has blocked this person's publishing (`publication_blocked`).
    delete:
      operationId: principals_unpublish_self
      summary: Unpublish the caller
      description: |
        Turns the caller's own switch off. Idempotent, and never refused.
        The caller's photo then answers 404 to everybody, including to
        somebody who kept its link.
      tags: [principals]
      security:
        - ownerAuth: []
      responses:
        '204':
          description: Unpublished.
        '401':
          description: Unauthorized.
