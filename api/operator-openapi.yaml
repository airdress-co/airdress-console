openapi: 3.1.0
info:
  title: airdress-operator
  version: 1.0.0
  description: |
    Local HTTP API exposed by the airdress-operator daemon.
    The operator binds to 127.0.0.1:8080 by default. All authenticated
    endpoints require a Bearer token (ownerAuth). Admin endpoints are
    restricted to the loopback interface at the listener layer.
  contact:
    email: noc@airdress.co
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:8080
    description: Local operator (default port)

tags:
  - name: tls
    description: The owner's certificate renewal trigger.
  - name: health
    description: Liveness and readiness probes (no auth).
  - name: metrics
    description: |
      Prometheus metrics (no auth). Served on the host's own listeners, not
      on the public API unless `[metrics] public = true`.
  - name: core
    description: Core resource-management API.
  - name: endpoints
    description: Endpoint enrollment and pairing.
  - name: federation
    description: Inter-operator federation.
  - name: chat
    description: Conversation and message APIs.
  - name: plugins
    description: |
      SPEC-002 plugin installs on the owner's own airdress — owner only
      (SPEC-119 D-11). The unauthenticated `/api/v1/airdresses/{airdress}/...`
      routes these replaced are gone; an install's plugin-db access is its
      `db_access` field.
  - name: ingest
    description: Event ingestion.
  - name: functions
    description: |
      SPEC-088 — hosted functions. A `Function` manifest applied through
      `/v1/apply` binds a signed WebAssembly bundle at `/fn/{name}`;
      this tag is that trigger route.
  - name: location
    description: |
      Chat SPEC-114 — location events from the owner's own phone to its
      own airdress: zone transitions, one-shot fixes, and sharing and
      consent state. Off unless `[location].enabled`; owner only; held
      encrypted at rest and published on a source of their own that the
      Events list and ingress-bound functions never read.
  - name: home
    description: |
      SPEC-116 — a home hub (Home Assistant) linked as an enrolled machine,
      reached over one held channel it dials out.
  - name: things
    description: |
      SPEC-120 — devices of any class enrolled as machines with purpose
      `thing` and linked as a `Thing`: they publish signed events and take
      commands, and hold no grants.
  - name: work
    description: |
      SPEC-182 — work items: tasks and RFIs on the company's own airdress.
      An item is read by its asker, its assignees, its watchers and the
      owner, and by nobody else; it is a company record, not end to end.
      Every route answers `403 not_enabled` (`feature: work`) while the
      `work` switch is off.
  - name: shells
    description: |
      SPEC-137 — interactive sessions on a person's own machine, from that
      person's enrolled devices. The operator routes end-to-end ciphertext
      between a device's leg and the machine's held channel, and authorizes
      on metadata. Every route answers `not_enabled` while `[shells]` is off.
  - name: machines
    description: |
      SPEC-095 Phase E — machines that enroll by keypair. A machine asks to
      enroll an Ed25519 key, the owner compares its fingerprint on the host
      and approves, and the machine then signs its requests with that key.
      No route here ever returns a bearer, a session or a secret.
  - name: admin
    description: Local-only (127.0.0.1) admin operations.
  - name: principals
    description: |
      SPEC-042 — multi-user chat. Owner manages sub-users via
      /v1/admin/sub-users; any principal manages their own row via
      /v1/me. Sub-users hit 403 (`error.code = "sub_user_forbidden"`)
      on the admin subtree per the SPEC-042 allowlist.

components:
  securitySchemes:
    hubAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token from the hub's authorization server (RFC 9068,
        `typ: at+jwt`) whose `aud` is exactly this operator's resource.
        Remote MCP accepts only these, for `https://<fqdn>/v1/mcp`.
    machineSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        SPEC-095 FR-61. An enrolled machine holds no bearer. It signs each
        request with its `machine_api` key over RFC 9421 — covered components
        `@method`, `@target-uri`, `content-digest` (and `content-type` when
        present), tag `airdress-machine`, keyid `machine:<uuid>#<kid>` — and
        sends `Signature-Input`, `Signature` and `Content-Digest` with no
        `Authorization`. A request carrying both is refused. Accepted on the
        resource plane (`/v1/apply`, `/v1/kinds/{kind}…`, `/fn/{name}`), where
        grants decide, and on `/v1/machines/self/keys`.

        SPEC-098: also accepted on the T-C routes `/v1/compute/{poll,ack,result,
        cancel-confirm,transport-confirmed}`, for the one machine this
        operator's `[role.apps] machine_name` names (`403 machine_not_bound`
        otherwise, `409 machine_binding_ambiguous` when several machines carry
        the name).

        SPEC-098: once the owner's approval of the machine expires, every
        signed request answers `401` with error code
        `machine_authorization_expired`, except `POST /v1/machines/reauth`.
        While an expiry is set, signed answers carry
        `Airdress-Authorization-Expires` (RFC 3339).
    ownerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    adminLocal:
      type: apiKey
      in: header
      name: X-Airdress-Admin-Token
      description: |
        `/admin/*` is served only on the host-local admin listener
        (`[admin] bind`, loopback only), never on the public listener,
        where the proxy answers it 404. `/admin/tls/*` also needs the
        host-local admin credential: the token the operator writes at
        start to `<[resources] secrets_dir>/admin-token` (mode 0600).
    enrollmentAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        A device's enrollment bearer. Distinct from `ownerAuth` in what it
        identifies rather than in its wire form: the operator resolves it
        to both a principal AND an enrollment, and SPEC-069 uses the
        enrollment id as the station identity — one device, one MLS leaf,
        one station, one identifier.
    federationAuth:
      type: http
      scheme: signature
      description: |
        HTTP signatures over the request body. Exact algorithm is
        defined by SPEC-008. Marked x-status: deferred-to-federation-auth.

  schemas:
    PttTransmission:
      type: object
      required: [transmission_id]
      description: |
        Names the transmission a keepalive or un-key refers to. Checked,
        not merely accepted: a request naming a transmission the floor is
        no longer running must be told it lost the floor rather than be
        allowed to renew or end whatever happens to be current.
      properties:
        transmission_id:
          type: string
          format: uuid
    MachineEnrollmentError:
      type: object
      description: An RFC 6749 §5.2-shaped error, as RFC 8628 uses for device polling.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - slow_down
            - authorization_pending
            - access_denied
            - expired_token
            - invalid_grant
            - invalid_client
            - grant_template_invalid
            - server_error
        error_description:
          type: string
    MachineAdminError:
      type: object
      description: |
        SPEC-098. An error from the owner's machine administration. `code` is
        one of `invalid_request`, `confirmation_required`,
        `confirmation_mismatch`, `no_pending_enrollment`, `enrollment_expired`,
        `no_machine`, `no_preauth_key`, `grant_template_invalid`,
        `server_error`.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    MachineAuthorization:
      type: object
      description: |
        SPEC-098. Until when the owner's approval of a machine holds. `expiry`
        is `set` (see `expires_at`), `disabled` (turned off by the owner) or
        `unrecorded` (approved before expiry existed; no expiry).
      required: [expires_at, expiry]
      properties:
        expires_at:
          type: [string, 'null']
          format: date-time
        expiry:
          type: string
          enum: [set, disabled, unrecorded]
    MachineGrantTemplate:
      type: object
      required: [kind, actions]
      additionalProperties: false
      properties:
        kind:
          type: string
        resource_name:
          type: [string, 'null']
        actions:
          type: array
          items:
            type: string
            enum: [Apply, Get, Delete, ReadStatus]
    SourcePublishJson:
      type: object
      required: [name, files]
      additionalProperties: false
      properties:
        name:
          type: string
        basedOn:
          type: string
        signature:
          type: string
          description: 128 hex characters, Ed25519 over the canonical file-set digest.
        signer:
          type: string
        signerRef:
          type: object
          properties:
            machine:
              type: string
        files:
          type: array
          items:
            type: object
            required: [path, contentBase64]
            properties:
              path:
                type: string
              contentBase64:
                type: string
    SourcePublished:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              bytes:
                type: integer
              sha256:
                type: string
        entry:
          type: string
        unreachable:
          type: array
          items:
            type: string
        sourceDigest:
          type: string
          description: '`sha256:<hex>` — the canonical file-set digest a source signature is made over (Ed25519 over its 32 raw bytes).'
        engineDigest:
          type: string
          description: Opaque. Do not parse.
        transpiler:
          type: string
        sdk:
          type: object
          description: The Functions SDK release the tree pins (`function.json` `sdk`), when it pins one; absent otherwise. A version includes the release's digest.
          properties:
            version:
              type: string
            digest:
              type: string
            modules:
              type: array
              description: The library modules the bundle reached, by name.
              items:
                type: string
        notes:
          type: array
          description: Information about the tree that never blocks — a deprecated or alpha library module, a concurrency the module warns about, a pass_headers entry with no effect, a required config key the applied spec lacks.
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              location:
                type: object
        warnings:
          type: array
          items:
            type: string
        dryRun:
          type: boolean
        created:
          type: boolean
    SourceError:
      type: object
      properties:
        error:
          type: string
          description: The refusal, snake_case.
        reason:
          type: string
          description: The same refusal as the status condition spells it (e.g. `TranspileFailed`), when the error is a refusal.
        message:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              line:
                type: integer
              column:
                type: integer
        denials:
          type: array
          items:
            type: object
            properties:
              capability:
                type: string
              detail:
                type: string
              grantPath:
                type: string
        fix:
          type: object
          description: 'The edit that resolves the refusal, when there is exactly one — for example `{"file": "function.json", "add": {"capabilities": […]}}` or `{"file": "function.json", "set": {"sdk": "1.0.0"}}`. What an editor offers as a quick fix.'
    SourceFile:
      type: object
      properties:
        path:
          type: string
        bytes:
          type: integer
        sha256:
          type: string
    SourceVersion:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        sourceDigest:
          type: string
        manifest:
          type: object
          description: The tree's function.json.
        files:
          type: array
          items:
            $ref: '#/components/schemas/SourceFile'
        signer:
          type: string
          nullable: true
          description: 64 hex characters, or null when unsigned source was allowed.
        signerRef:
          type: string
          format: uuid
          nullable: true
        origin:
          type: string
          enum: [api, import]
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        engineDigest:
          type: string
        transpiler:
          type: string
    SourceHistory:
      type: object
      properties:
        name:
          type: string
        current:
          type: string
          nullable: true
          description: The version serving now.
        deployments:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              generation:
                type: integer
              at:
                type: string
                format: date-time
              actor:
                type: string
                nullable: true
              current:
                type: boolean
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              publishedAt:
                type: string
                format: date-time
              publishedBy:
                type: string
              origin:
                type: string
                enum: [api, import]
              files:
                type: integer
              bytes:
                type: integer
              current:
                type: boolean
    SourceConflict:
      type: object
      description: '`source_base_stale` names both versions and who published the current one; `source_managed_externally` names the import.'
      properties:
        error:
          type: string
          enum: [source_base_stale, source_managed_externally]
        message:
          type: string
        basedOn:
          type: string
          nullable: true
        current:
          type: string
        currentPublishedAt:
          type: string
          format: date-time
          nullable: true
        currentPublishedBy:
          type: string
          nullable: true
    FunctionLogPage:
      type: object
      properties:
        name:
          type: string
        retention:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: The cursor for `?after=`.
              version:
                type: string
                nullable: true
              invocation:
                type: string
              at:
                type: string
                format: date-time
              level:
                type: string
                enum: [trace, debug, info, warn, error]
              kind:
                type: string
                enum: [invocation, log, filter_error, dropped]
              body:
                type: object
    SdkRelease:
      type: object
      properties:
        version:
          type: string
        digest:
          type: string
        status:
          type: string
          enum: [current, deprecated, withdrawn]
        replacement:
          type: string
          nullable: true
        reason:
          type: string
        host:
          type: string
        modules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              specifier:
                type: string
              needs:
                type: array
                items:
                  type: string
              bytes:
                type: integer
              bundledBytes:
                type: integer
              stability:
                type: string
              testOnly:
                type: boolean
              description:
                type: string
    FunctionTemplate:
      type: object
      description: A template.json — the full schema is `function-template` under /v1/schemas.
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        entry:
          type: string
        requires:
          type: object
          description: One entry per host world the owner must grant; `http.hostsRequired` means the owner names the hosts.
        events:
          type: object
          description: 'The spec.events block the first apply must carry, when the template is written for events (`{ "source": "location" }` for location-status).'
          properties:
            source:
              type: string
              enum: [ingress, location]
        config:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum: [string, number, boolean, secret]
                  required:
                    type: boolean
                  default: {}
                  description:
                    type: string
    FunctionTemplateWithFiles:
      allOf:
        - $ref: '#/components/schemas/FunctionTemplate'
        - type: object
          properties:
            files:
              type: object
              additionalProperties:
                type: string
              description: Archive path → text.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

    PingResponse:
      type: object
      required: [operator_version, name]
      properties:
        operator_version:
          type: string
        name:
          type: string

    WhoamiResponse:
      type: object
      required: [sub, airdress_name, operator_version]
      properties:
        sub:
          type: string
        email:
          type: string
        airdress_name:
          type: string
          description: |
            The operator's airdress — its configured `airdress`, e.g.
            `alice.a.airdr.es`. Not the operator's display `name`, which
            this field carried before SPEC-049 Phase 6.
        operator_version:
          type: string

    MapsSearchAnswer:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              name: {type: [string, "null"]}
              address: {type: object, additionalProperties: {type: string}}
              point: {type: array, items: {type: number}, minItems: 2, maxItems: 2, description: '[lng, lat]'}
              layer: {type: string, enum: [address, venue, street, locality, region, country]}
              credit: {type: string}
              osm:
                type: object
                properties:
                  type: {type: string, enum: [relation, way, node]}
                  id: {type: integer}
        coverage: {type: string}
    MapsRefusal:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_request, maps_not_configured, maps_throttled, maps_unavailable]}
            message: {type: string}

    Capabilities:
      type: object
      required: [agent_bus, agent_devices, mcp_local, mcp_remote]
      additionalProperties: false
      properties:
        agent_bus:
          type: boolean
          description: The rendezvous agent sessions coordinate through.
        agent_devices:
          type: boolean
          description: |
            Agents enrolled as devices of their own class. Turning this
            off suspends them rather than revoking them.
        mcp_local:
          type: boolean
          description: |
            The editor path. Advisory by decision: a local client calls
            this operator's ordinary API, over the caller's own data,
            which the owner's CLI reaches with or without an editor. The
            value is published so our own client honours it; it is not a
            boundary, and the three above and below are.
        mcp_remote:
          type: boolean
          description: |
            A hosted assistant, over `/v1/mcp`. Enforced here: without it
            that route and its protected-resource document answer
            `not_enabled`.
          # The shape of that refusal — `{error: "not_enabled", feature,
          # message}` — is not a schema here yet, deliberately: no route
          # in this version can give it, because the three enforced
          # surfaces are not built. It is documented when the first one
          # lands, rather than published as a response nothing returns.

    ResourceManifest:
      type: object
      description: A resource manifest in YAML or JSON format.
      additionalProperties: true

    KindList:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: string

    ResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'

    Resource:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        spec:
          type: object
          additionalProperties: true

    ResourceStatus:
      type: object
      required: [kind, name, status]
      properties:
        kind:
          type: string
        name:
          type: string
        status:
          type: object
          additionalProperties: true

    DomainsView:
      type: object
      required: [enabled, refreshed, domains]
      properties:
        enabled:
          type: boolean
          description: >
            Whether custom domains are switched on for this operator. When
            false the list is always empty and every foreign Host is 421.
        refreshed:
          type: boolean
          description: >
            Whether the alias set has been read from the hub at least once.
            An unfetched empty set is not a confirmed empty set.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainView'

    DomainView:
      type: object
      required: [hostname, wildcard, cert_mode, certificate, consecutive_failures]
      properties:
        hostname:
          type: string
          example: app.example.com
        wildcard:
          type: boolean
        cert_mode:
          type: string
          enum: [http01, dns01_alias]
        certificate:
          type: boolean
          description: Whether an unexpired certificate for this exact name is held.
        not_after:
          type: string
          format: date-time
        consecutive_failures:
          type: integer
          format: int32
          minimum: 0

    EnrollmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'

    Enrollment:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        airdress:
          type: string
          description: |
            The airdress this enrollment belongs to. An operator is one
            airdress (its configured `airdress`), so on a current operator
            this is always that airdress.
        principal_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The principal this device acts as — the key the listing is
            already scoped by, so it discloses nothing the caller could not
            infer from what it is shown. `null` for a device paired before
            principals existed. Additive.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this device last made an authenticated request or opened
            an event stream. `null` means never since the column existed;
            read it as `created_at`. Never an authentication input. Additive.
        revoked_at:
          type: string
          format: date-time
          description: |
            Present only on a revoked row, which only the single-enrollment
            read serves. Absent on an active row.
        revoked_reason:
          type: string
          enum: [idle]
          description: |
            The reason the revoker announced, when it announced one: `idle`
            from the idle sweep. Absent for every other revocation — an
            owner's delete, a root reset — and on an active row.
        device_class:
          type: string
          enum: [human, agent]
          description: |
            SPEC-133 §9.4 — `agent` for an agent device, listed in its own
            section; its `expires_at` is its approval's expiry. Additive.
        harness:
          type: string
          description: An agent's harness (data, the name its device host sends); absent otherwise.
        suspended_at:
          type: string
          format: date-time
          description: |
            SPEC-133 FR-104 — set while agent devices are switched off; the
            agent is suspended, never revoked, and answers `403 not_enabled`
            until they are on again. Absent otherwise.
        delegation_only:
          type: boolean
          description: |
            SPEC-163 — the device holds a root-signed delegation and never
            the root (the CLI, the editor, an agent device). `key_custody`
            reads `client_held` for it exactly as for a phone; this is what
            says it can neither approve a join nor object to a root reset.
            Absent from an operator that predates it. Additive.
        metadata:
          type: object
          additionalProperties: true

    PendingRootRecovery:
      type: object
      required: [request_id, scheduled_for, requested_at, prior_enrollment_count]
      description: |
        One pending root reset as a device may see it. Deliberately absent:
        the requester's account subject, the assertion, its `jti`, and the
        address it was asked from — the reader may be either party, and
        showing one the other's network is a leak in both directions.
      properties:
        request_id:
          type: string
          format: uuid
        scheduled_for:
          type: string
          format: date-time
          description: The deadline after which the reset executes uncontested.
        requested_at:
          type: string
          format: date-time
        prior_enrollment_count:
          type: integer
          description: Every active enrollment row at request time.
        objector_enrollment_count:
          type: integer
          nullable: true
          description: |
            Of those, the rows seen inside `[recovery] objector_window` —
            the count that graduated the request. `null` for a request
            opened before the window existed.
        excluded_enrollment_count:
          type: integer
          nullable: true
          description: |
            `prior_enrollment_count - objector_enrollment_count`: the rows
            the wait was not held for. `null` with the objector count.
        objector_window_days:
          type: integer
          nullable: true
          description: The window in whole days. `null` with the objector count.

    RootRecoveryRequestStatus:
      type: object
      required: [state, scheduled_for]
      properties:
        state:
          type: string
          enum: [pending, executed, cancelled, expired]
        scheduled_for:
          type: string
          format: date-time
          description: The deadline after which the reset executes uncontested.
        executed_at:
          type: string
          format: date-time
          description: Once executed — when.

    DeviceJoinRequestBody:
      type: object
      required: [hub_token, public_key, device_label]
      properties:
        hub_token:
          type: string
          description: Hub-issued enrollment token, `purpose` = `enrollment`.
        public_key:
          type: string
          description: |
            The asking device's ephemeral X25519 public key for the transfer
            ceremony, base64url without padding, 32 bytes.
        device_label:
          type: string
          maxLength: 80
          description: What the deciding devices are shown.
        device_class:
          type: string
          enum: [human, agent]
          default: human
          description: |
            SPEC-137 §5.2, SPEC-133 §9.2. `agent` is refused `403
            not_enabled` (`feature: agent_devices`) while `[agent_devices]
            enabled` is off. An agent is always delegation-only (its kind is
            `agent`) and names its `harness`.
        delegation_only:
          type: boolean
          default: false
          description: |
            The asker takes a root-signed delegation and never the root seed
            (the CLI, the editor). Such a request is approved only with
            `{approval: delegation}`, and a phone's only by root transfer.
            When true, `device_kind`, `device_public_key` and `device_id`
            are required; when false, they must be absent.
        device_kind:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: What the device is (`cli`); the delegation must sign the same word.
        device_public_key:
          type: string
          description: The asker's Ed25519 identity key, base64url without padding, which the delegation must name.
        device_id:
          type: string
          pattern: '^[A-Za-z0-9-]{1,64}$'
          description: The device id the delegation must name.
        harness:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: |
            SPEC-133 §9.2 — agents only, and required for one: which program
            runs the agent, as data. The delegation signs the
            same word.
        renews:
          type: string
          format: uuid
          description: |
            SPEC-133 §9.2 step 5 — agents only: the agent's own enrollment
            this request renews (same device id and key, not revoked; an
            expired one may renew). Approving it renews that row in place
            for thirty days; nothing new is enrolled. `422 invalid_renewal`
            otherwise.

    DeviceJoinRequestCreated:
      type: object
      required: [request_id, state, expires_at]
      properties:
        request_id:
          type: string
          format: uuid
          description: The read capability for `GET /v1/endpoints/device-join-requests/{id}`.
        state:
          type: string
          enum: [pending, unanswerable]
          description: |
            `pending` — enrolled devices have been told and one may approve.
            `unanswerable` — the airdress has no active human enrollment,
            so no device can approve; the request expires normally and is
            listed to nobody. The asking app should offer the root reset
            straight away, because with zero devices that reset executes
            immediately for the same caller. Absent on older operators;
            treat absence as `pending`.
        expires_at:
          type: string
          format: date-time

    PendingDeviceJoinRequest:
      type: object
      required: [request_id, device_label, public_key, created_at, expires_at]
      description: |
        One open request as a deciding device sees it — and nothing that
        names the asker's account or network.
      properties:
        request_id:
          type: string
          format: uuid
        device_label:
          type: string
        public_key:
          type: string
          description: The asking device's ephemeral X25519 public key, base64url.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        delegation_only:
          type: boolean
          description: |
            Present (true) only on a delegation-only request: approve it by
            minting a root-signed delegation naming `device_public_key`,
            `device_id` and `device_kind`, and never by sealing the root.
            A phone's request carries none of these five fields.
        device_class:
          type: string
          enum: [human, agent]
        device_kind:
          type: string
        device_public_key:
          type: string
          description: The asker's Ed25519 identity key, base64url.
        device_id:
          type: string
        harness:
          type: string
          description: An agent's harness (SPEC-133 §9.2); agents only.
        renews:
          type: string
          format: uuid
          description: |
            The agent enrollment this request renews: show a re-approval
            prompt for that agent rather than a new device.

    DeviceJoinRequestStatus:
      type: object
      required: [request_id, state, device_label, requested_at, expires_at]
      properties:
        request_id:
          type: string
          format: uuid
        device_label:
          type: string
          description: The label the asking device supplied when it asked.
        requested_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, approved, declined, expired, unanswerable, withdrawn]
          description: |
            `unanswerable` — no device could ever approve this (the airdress
            had no active human enrollment when it was asked); offer the
            reset. `withdrawn` — the asking device took it back.
        expires_at:
          type: string
          format: date-time
        slot_id:
          type: string
          format: uuid
          description: Once approved — the root-transfer slot to collect from.
        sender_public_key:
          type: string
          description: Once approved — the approver's ephemeral X25519 public key, base64url.
        delegation:
          type: object
          additionalProperties: true
          description: |
            Once a delegation-only request is approved — the root-signed
            delegation naming the asker's key, id and kind, which it enrolls
            with. Never present with `slot_id`.

    PairingCodeRequest:
      type: object
      required: [role, key_custody, transport_profile]
      properties:
        role:
          type: string
          enum: [human_held, device_held, agent_held, gateway_proxied, compute_held]
        key_custody:
          type: string
          enum: [client_held, operator_held]
        transport_profile:
          type: string
        ttl_seconds:
          type: integer
          default: 300
          description: Clamped to 3600.
        principal_id:
          type: string
          format: uuid
          description: |
            The principal the redeeming device will authenticate as.

            Owner-only: a device that sends it is refused with
            `pairing_code_escalation`, including a device the owner paired.
            It exists because a sub-user cannot mint a code for themselves
            — `POST /v1/endpoints/pairing-codes` is not on the SPEC-042
            sub-user allowlist — so without it no sub-user can ever hold a
            device. Omit it and the code carries the minter's own identity,
            which is the SPEC-048/SPEC-049 behaviour and is unchanged.

            Pair it with `key_custody: operator_held`. A sub-user's device
            cannot sign a delegation with the airdress root — it has never
            held it and must never hold it — so a `client_held`
            sub-user code is refused at redemption with
            `409 root_key_mismatch` on every device but the founding one.
            An `operator_held` enrollment presents no root: it adopts the
            airdress's pin, which does not move.

    PairingCodeResponse:
      type: object
      required: [code, expires_at, qr_url]
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        qr_url:
          type: string
          format: uri

    Error:
      type: object
      description: |
        The operator's `{ "error": { "code", "message" } }` envelope, as
        emitted by the chat and endpoint route families. Distinct from
        `Problem` (RFC 9457), which the resource-management surface uses.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
              description: Human-readable explanation.

    PushSubscriptionRegistration:
      type: object
      description: |
        SPEC-008 — an RFC 8030 push endpoint plus the RFC 8291 key
        material to encrypt to. The operator relays ciphertext the push
        service cannot read, so these keys are what makes the hosted and
        the self-hosted paths equally confidential.
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The push service endpoint the distributor issued. Must be
            `https://` and outside loopback, link-local and private
            ranges unless the operator opted in. Never returned by any
            read — it is a bearer capability to notify this device.
          examples: ['https://ntfy.example.com/UP123abc']
        p256dh:
          type: string
          description: |
            Base64url of the client's uncompressed P-256 public key
            (65 bytes). Padding optional.
        auth:
          type: string
          description: Base64url of the 16-byte auth secret. Padding optional.

    PushSubscriptionStatus:
      type: object
      description: |
        SPEC-008 — deliberately says nothing secret. The host names the
        push service the user chose; the rest is health, so that "I don't
        get notifications" is answerable without a debugger.
      required: [present, failure_count]
      properties:
        present:
          type: boolean
          description: Whether a subscription is registered at all.
        host:
          type: [string, 'null']
          description: The endpoint's host. Never the path.
          examples: ['ntfy.example.com']
        created_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
          description: Last time a push service accepted a send.
        failure_count:
          type: integer
          description: Consecutive failures since the last success.
        disabled_at:
          type: [string, 'null']
          format: date-time
        disabled_reason:
          type: [string, 'null']
          description: |
            Why delivery was given up on. Shown to the user in Settings.

    FederationMetadata:
      type: object
      additionalProperties: true

    FederationLocal:
      type: object
      additionalProperties: true

    FederationHandshakeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    PairRequest:
      type: object
      additionalProperties: true

    PairResponse:
      type: object
      additionalProperties: true

    NewTitledConversationRequest:
      type: object
      properties:
        title:
          type: string
          description: Optional display title for the new thread.

    AgentDescriptor:
      type: object
      required: [id, supports_multi_conversation]
      properties:
        id:
          type: string
          example: operator
        supports_multi_conversation:
          type: boolean
          description: |
            Whether `POST /v1/chat/conversations/agent/{agent_id}` will open
            a new thread (true → 201) or return the existing one (false →
            200). The conjunction of `traits.supportsMultiConversation` over
            every inference pool member.

    Conversation:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target_airdress:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hidden_at:
          type: string
          format: date-time
          description: |
            When the owner hid this conversation. Absent when it is visible.
            Hidden conversations are left out of `GET /v1/chat/conversations`
            unless `include_hidden=true`; a new message clears this.

    ConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        total:
          type: integer

    Message:
      type: object
      required: [id, conversation_id, role, seq]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
        seq:
          type: integer
        sender_principal_id:
          type: string
          format: uuid
          description: |
            SPEC-070 — the principal that SENT this message, which is
            not necessarily the principal that owns the row.

            On the principal mirror lane one logical message is stored
            as two rows under two per-principal keys, and BOTH carry
            the sender's id: on the author's copy it equals the row
            owner, on the recipient's copy it does not. Compare it
            against your own id from `GET /v1/me` to decide whether a
            message is outgoing. Do not use `role` for that — both
            copies are `user`, because both sides are humans.

            An id and not a derived "is this mine" boolean: SPEC-069's
            multi-party channel must render *which* participant spoke,
            which a boolean cannot answer.

            Absent when the operator does not know who sent it: an
            operator-generated row (`role` assistant/system), a
            federated row, or any row written before migration 0035.
            Render an absent sender with the legacy `role == "user"`
            heuristic and show no sender attribution.
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
        content_mode:
          type: string
          enum: [plaintext, ciphertext, encrypted]
          description: |
            SPEC-035 on-disk content mode. Only present when the
            caller passed `?include_ciphertext=true` to
            `GET /v1/chat/conversations/{id}/messages`.
        blocks_ciphertext:
          type: string
          description: |
            SPEC-035 raw AEAD ciphertext (base64-no-pad). Only
            present when `?include_ciphertext=true` AND `content_mode
            = "encrypted"`. The cipher key never leaves the operator,
            so this is observability — clients still get the
            plaintext via `blocks`.
        blocks_nonce:
          type: string
          description: |
            SPEC-035 AEAD nonce (base64-no-pad, 12 bytes). Same gate
            as `blocks_ciphertext`.

    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    ClientConfig:
      type: object
      additionalProperties: true
      properties:
        protocol_versions:
          type: object
          description: >-
            Versions of the protocols this operator speaks, keyed by
            protocol (formerly `spec_versions` keyed by spec number).
          properties:
            chat_federation:
              type: string
              description: Chat federation protocol version.
            enrollment:
              type: string
              description: Endpoint enrollment protocol version.
            client_runtime:
              type: string
              description: Chat client runtime protocol version.
        features:
          type: object
          additionalProperties: true
          properties:
            location_enabled:
              type: boolean
              description: >-
                Whether this operator accepts location events at
                `/v1/location/events`.
            location_track_heartbeat_seconds:
              type: integer
              minimum: 60
              maximum: 3600
              description: >-
                How often, in seconds, a phone running a continuous track
                sends its heartbeat (`kind: track`, `phase: alive`); the
                operator's `[location] track_heartbeat`. Present only while
                `location_enabled`. A phone that finds none beats every 600
                seconds.

    LocationError:
      type: object
      description: '`{ "error": "<code>" }`, with a `message` where there is something to say.'
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    LocationEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LocationEvent'

    LocationEvent:
      type: object
      additionalProperties: false
      required: [id, at, kind]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; the dedupe key.
        at:
          type: string
          format: date-time
          description: Device time.
        kind:
          type: string
          enum: [fix, zone, state, track]
        origin:
          type: string
          enum: [one_shot, live, zone_foreground, zone_background, track]
          description: Required for a fix or zone event; absent for a state or track event.
        track_id:
          type: string
          pattern: '^trk_[!-~]{1,60}$'
          description: |
            The continuous track a fix was taken on. Required on a fix with
            `origin: track` (`track_id_missing`), refused on every other
            event (`track_id_unexpected`); a track event names its track in
            `track.id`.
        fix:
          type: object
          additionalProperties: false
          required: [lat, lon, precision]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
            accuracy_m:
              type: number
              minimum: 0
            precision:
              type: string
              enum: [approximate, precise]
        zone:
          type: object
          additionalProperties: false
          required: [id, label, transition]
          properties:
            id:
              type: string
              maxLength: 64
            label:
              type: string
              maxLength: 64
            transition:
              type: string
              enum: [entered, exited]
        state:
          type: object
          additionalProperties: false
          properties:
            sharing:
              type: string
              enum: [paused, resumed]
            reason:
              type: string
              maxLength: 64
            consent:
              type: object
              additionalProperties: false
              required: [capability, granted, copy_version]
              properties:
                capability:
                  type: string
                  maxLength: 64
                granted:
                  type: boolean
                copy_version:
                  type: integer
                  minimum: 0
        track:
          type: object
          additionalProperties: false
          description: |
            For `kind: track` — a continuous track the owner started on the
            phone: started, ended, or `alive`, the heartbeat a running track
            sends every `features.location_track_heartbeat_seconds`. A start
            or end is published as `dev.airdress.location.track.started` or
            `dev.airdress.location.track.ended`; a heartbeat is acknowledged
            and counted as accepted, but neither stored nor published. A
            running track heard from by nothing for `[location]
            track_silent_after` is announced as
            `dev.airdress.location.track.silent` (then `.recovered` when it
            is heard from again), and one whose `ends_at` passed with no
            `ended` as `dev.airdress.location.track.lost`. Anything
            malformed here is `invalid_track`.
          required: [id, phase, precision]
          properties:
            id:
              type: string
              pattern: '^trk_[!-~]{1,60}$'
            phase:
              type: string
              enum: [started, ended, alive]
            precision:
              type: string
              enum: [approximate, precise]
            ends_at:
              type: string
              format: date-time
              description: >-
                When the track ends by itself. Required when it starts,
                refused on `alive`.
            reason:
              type: string
              enum: [expired, stopped, app_removed, low_battery, grant_reduced, guard_closed, interrupted]
              description: >-
                Why it ended. Required when it ends, refused when it starts
                and on `alive`.

    ClientMe:
      type: object
      additionalProperties: true

    DbAccessResponse:
      type: object
      additionalProperties: true

    PluginInstallRequest:
      type: object
      additionalProperties: false
      description: |
        Name exactly one source: `app_type` (a definition the operator loaded
        from its `apps_dirs`), or `plugin` and optionally `version` (a release
        from the registry, listed in an index a key pinned in
        `[apps.registry] index_keys` signed, and signed by a member of the
        install's signer set).
      properties:
        app_type:
          type: string
          description: App name matching `metadata.name` in a loaded definition.
        plugin:
          type: string
          description: A plugin in the registry.
        version:
          type: string
          description: The release of `plugin` to install; `latest` when absent.
        subdomain:
          type: string
          description: Overrides the definition's `spec.subdomain`.
        config:
          type: object
          additionalProperties: true
          description: |
            The install's config: keys the app declares in its manifest's
            `config` schema, values of the declared type. Projected into the
            plugin's environment at every start; unknown keys, wrong types
            and missing required fields are refused with 422.
        signers:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            Who may sign the releases this install runs — the same set a
            source function pins. Absent: the set the install already pins,
            or for a new install the author keys the signed index lists
            (a dry run shows them for the owner to confirm). An upgrade
            signed by anyone outside the set is refused.
          items:
            type: object
            additionalProperties: false
            description: Exactly one of `key` and `machine`.
            properties:
              key:
                type: string
                pattern: '^[0-9a-fA-F]{64}$'
                description: An Ed25519 public key, 64 hex characters.
              machine:
                type: string
                minLength: 1
                description: An approved machine, by name or id; its live source-signing keys.

    PluginInstallPatch:
      type: object
      properties:
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: |
            The install's config: keys the app declares in its manifest's
            `config` schema, values of the declared type. Replaces the stored
            config and restarts a running instance on it; unknown keys, wrong types
            and missing required fields are refused with 422.

    PluginInstall:
      type: object
      required: [id, airdress, subdomain, app_type]
      properties:
        id:
          type: string
          description: |
            The install's durable id (a ULID) — the same for the life of the
            install, and the `{id}` of its routes. The install's subdomain is
            also accepted as `{id}`.
        install_id:
          type: string
          description: The same as `id`.
        version:
          type: string
          description: The version the install runs, as its manifest declares it.
        source:
          type: string
          enum: [local, registry]
        signed_by:
          type: string
          description: The id of the author key that verified a registry release (install response only).
        author:
          type: object
          description: |
            Who signed a registry release, and the signer set the install
            pins from now on (install response only).
          properties:
            author:
              type: string
              description: The author the signed index names.
            key:
              type: string
              description: The key that verified the release, 64 hex characters.
            machine:
              type: string
              description: The approved machine whose source-signing key it is, for a `machine` member.
            signers:
              type: array
              items:
                type: object
                additionalProperties: true
            provenance_sha256:
              type: string
              description: SHA-256 of the registry-attested build provenance.
        consent:
          type: object
          additionalProperties: true
          description: |
            What the plugin will be able to do, per scope (install response
            only): the host protocol version, the airdress scope's and the
            personal scope's egress hosts, its database capability and its
            declared resource limits. A dry run returns it without installing.
        airdress:
          type: string
          description: The owner's airdress label the install is held under.
        subdomain:
          type: string
        app_type:
          type: string
        runtime_state:
          type: string
          enum: [cold, starting, hot, unserved]
          description: '`unserved` for a stored install the runtime cannot serve.'
        served:
          type: boolean
          description: |
            Whether the runtime serves the install. `false` for a stored
            install whose definition or artifact no longer resolves; it is
            listed so the owner can uninstall it or install over it, and it
            has no DNS name.
        not_served_reason:
          type: string
          description: Why the install is not served, when `served` is false.
        last_request_age_seconds:
          type: integer
          minimum: 0
          description: Seconds since the last request or connection ended; 0 while one is open.
        config:
          type: object
          additionalProperties: true
          description: The install's stored config.
        db_access:
          $ref: '#/components/schemas/DbAccessResponse'

    PluginGrantRequest:
      type: object
      additionalProperties: false
      required: [install, type, resource, principal, actions]
      properties:
        install:
          type: string
          description: The install id.
        type:
          type: string
          description: A resource type the install's manifest declares.
        namespace:
          type: string
          description: "`person:<principal id>` or `install:<InstallId>`; the caller's own personal namespace when absent."
        resource:
          type: string
        principal:
          type: string
          description: The grantee's principal id.
        actions:
          type: array
          minItems: 1
          items:
            type: string

    PluginGrant:
      type: object
      required: [id, install, type, namespace, resource, principal, actions, granted_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        install:
          type: string
        type:
          type: string
        namespace:
          type: string
        resource:
          type: string
        principal:
          type: string
        actions:
          type: array
          items:
            type: string
        granted_by:
          type: string
        created_at:
          type: string
          format: date-time

    PluginInstallError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            A stable reason, when the refusal has one: `index_unsigned`,
            `index_signature_invalid`, `index_expired`, `index_rollback`,
            `index_entry_invalid`, `author_unknown`, `signers_invalid`,
            `author_signer_mismatch`, `author_key_revoked`,
            `author_key_compromised`, `author_mismatch`, `signers_unavailable`,
            `provenance_missing`, `provenance_signature_invalid`,
            `provenance_mismatch`, `bundle_unsigned`,
            `bundle_signature_invalid`, `release_mismatch`, `digest_mismatch`,
            `manifest_invalid`, `template_variable_unknown`,
            `artifact_path_relative`, `artifact_path_mismatch`,
            `artifact_missing`, `host_api_unsupported`, `host_action_invalid`,
            `resource_type_invalid`, `plugin_not_found`,
            `version_not_found`, `version_yanked`, `registry_unavailable`,
            `provision_failed`.
        step:
          type: string
          enum: [resolve, signature, provenance, manifest, prepare, artifact, download, provision]
          description: Where a registry install stopped.
        detail:
          type: string

    IngestEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestEvent'

    IngestEvent:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        payload:
          type: object
          additionalProperties: true
        received_at:
          type: string
          format: date-time

    IngestEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    EndpointMetrics:
      type: object
      additionalProperties: true

    DnsValidateRequest:
      type: object
      additionalProperties: true

    DnsValidateResponse:
      type: object
      additionalProperties: true

    DnsValidateBatchRequest:
      type: object
      additionalProperties: true

    DnsValidateBatchResponse:
      type: object
      additionalProperties: true

    TlsRenewRequest:
      type: object
      additionalProperties: true

    TlsRenewResponse:
      type: object
      additionalProperties: true

    # ── SPEC-042 ────────────────────────────────────────────────────
    CreateSubUserRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
    CreateSubUserResponse:
      type: object
      required: [id, display_name, token]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        token:
          type: string
          description: |
            Bearer token for the new sub-user. Returned ONCE here.
            URL-safe base64 (no pad). The operator stores only the
            SHA-256 hash; there is no read-back. If lost, revoke and
            mint anew.
    SubUserSummary:
      type: object
      required: [id, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ConversationMetadata:
      type: object
      description: |
        Conversation metadata (counterparty + counts + timestamps) for
        an owner-admin view into a sub-user's chats. Never includes
        message content.
      required: [conversation_id, counterparty_kind, message_count, created_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        counterparty_kind:
          type: string
          enum: [self, principal, airdress, agent]
        counterparty_principal_id:
          type: string
          format: uuid
          nullable: true
        counterparty_agent_id:
          type: string
          nullable: true
        counterparty_airdress:
          type: string
          nullable: true
        message_count:
          type: integer
          format: int64
        last_message_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    MeView:
      type: object
      required: [id, role, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, sub_user]
        display_name:
          type: string
        published_name:
          type: string
          description: The name this person goes by in public, when they set one.
        created_at:
          type: string
          format: date-time
    PatchMeRequest:
      type: object
      description: |
        Either field, or both; an empty object is refused. `display_name`
        used to be required, so a client that sends only that is unaffected.
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        published_name:
          type: [string, 'null']
          maxLength: 80
          description: |
            The name this person goes by in public. Absent leaves it alone;
            `null` or blank clears it, and publishing then falls back to
            `display_name`. Not unique. Not refused while the owner has
            blocked this person's publishing.
    PublicationView:
      type: object
      required: [published, blocked]
      properties:
        published:
          type: boolean
          description: Switched on by the person AND not blocked by the owner.
        since:
          type: string
          format: date-time
        blocked:
          type: boolean
          description: |
            The owner of this airdress has turned this person's publishing
            off, and only the owner can turn it back on.
        blocked_since:
          type: string
          format: date-time
        display_name:
          type: string
          description: The name that is, or would be, shown.
        avatar_url:
          type: string
          description: |
            The caller's own photo. It answers 404 to everybody while the
            caller is not published.

paths:
  # ── Health ───────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: health_get_health
      summary: Liveness check
      description: Returns "ok" when the operator process is alive.
      tags: [health]
      security: []
      responses:
        '200':
          description: Operator is alive.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /healthz:
    get:
      operationId: health_get_healthz
      summary: Liveness check (Kubernetes alias)
      description: Kubernetes-compatible liveness probe alias for /health.
      tags: [health]
      security: []
      responses:
        '200':
          description: Operator is alive.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /livez:
    get:
      operationId: health_get_livez
      summary: Liveness probe
      description: Standard liveness probe endpoint.
      tags: [health]
      security: []
      responses:
        '200':
          description: Operator is alive.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      operationId: health_get_readyz
      summary: Readiness probe
      description: |
        Returns 200 when all readiness checks pass, 503 otherwise.
        Pass ?verbose=true for per-check detail.
      tags: [health]
      security: []
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: All checks pass.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: One or more checks failing.
          content:
            text/plain:
              schema:
                type: string

  /.well-known/airdress/keys.json:
    get:
      operationId: federation_get_airdress_keys
      summary: This operator's public keys (JWKS)
      description: |
        SPEC-095 FR-41. A JWK Set (RFC 7517; OKP/Ed25519 per RFC 8037) of the
        operator's currently valid `token_issuer` and `http_signing` public
        keys, each tagged with `airdress_purpose`. A rotated-out key is listed
        with `exp` until its overlap ends. Never carries a private component.

        Served only when `[identity] publish_keys = true` (default false,
        because publishing keys is a metadata increase); otherwise 404.
        Trusting it is as strong as web-PKI trust in the HTTPS name.
      tags: [federation]
      security: []
      responses:
        '200':
          description: The key set. `Cache-Control` is `max-age=300`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: max-age=300
          content:
            application/jwk-set+json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, use, airdress_purpose]
                      properties:
                        kty:
                          type: string
                          enum: [OKP]
                        crv:
                          type: string
                          enum: [Ed25519]
                        x:
                          type: string
                          description: The public key, base64url without padding.
                        kid:
                          type: string
                        use:
                          type: string
                          enum: [sig]
                        airdress_purpose:
                          type: string
                          enum: [token_issuer, http_signing, transport]
                        exp:
                          type: integer
                          description: Unix seconds; set only on a rotated-out key.
        '404':
          description: Publishing is not enabled on this operator.
        '503':
          description: A key file could not be read.

  /readyz/{name}:
    get:
      operationId: health_get_readyz_named
      summary: Named readiness check
      description: Returns the status of a single named readiness check.
      tags: [health]
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [ping, pg, migrations, apps]
      responses:
        '200':
          description: Check passes.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Check failing.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unknown check name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ── Metrics ──────────────────────────────────────────────────────────────

  /metrics:
    get:
      operationId: metrics_get_metrics
      summary: Prometheus metrics
      description: |
        Prometheus (OpenMetrics) scrape: the event engine, the agent bus,
        plugins, things and the proxy. Counters and gauges with fixed label
        values, no identities — but rates and lags read over time say when
        an airdress is busy, so it is not served on the public API by
        default, where this path answers `404` like any route the operator
        does not have.

        Served, with no credential, on:
        - the host-local admin listener (`[admin] bind`, loopback only);
        - the host link (`[host_link]`, link-local) as `GET /internal/metrics`;
        - `[metrics] listen`, a listener of its own on an address the
          self-hoster names, when set;
        - the public API, only with `[metrics] public = true`.
      tags: [metrics, admin]
      x-internal: true
      security: []
      responses:
        '200':
          description: OpenMetrics text.
          content:
            application/openmetrics-text:
              schema:
                type: string
        '404':
          description: |
            On the public API without `[metrics] public = true`: the same
            `route_not_found` answer as any route this operator does not have.

  /v1/chat/ptt/metrics:
    get:
      operationId: metrics_get_ptt_metrics
      summary: Push-to-talk lane metrics (compatibility route)
      description: |
        The push-to-talk lane's five unlabelled scalars
        (`airdress_ptt_audio_egress_bytes_total`, `_bursts_relayed_total`,
        `_monitor_streams`, `_monitors_shed_total`, `_egress_headroom_ratio`).
        They name no conversation, person or device, but read over time they
        say when an airdress is talking and how many are listening.

        They are part of `GET /metrics` on the operator's own listeners
        whenever `chat.ptt_enabled`. This route of their own is mounted on
        the public API only with `[metrics] public = true` (and
        `chat.ptt_enabled`), for scrapers that read it before; otherwise it
        answers `404` like any route the operator does not have.
      tags: [metrics, admin]
      x-internal: true
      deprecated: true
      security: []
      responses:
        '200':
          description: OpenMetrics text, the lane's families only.
          content:
            application/openmetrics-text:
              schema:
                type: string
        '404':
          description: |
            Without `[metrics] public = true`, or with `chat.ptt_enabled`
            off: the same `route_not_found` answer as any route this
            operator does not have.

  # ── Core ─────────────────────────────────────────────────────────────────

  /v1/ping:
    get:
      operationId: core_get_ping
      summary: Ping the operator
      description: Returns the operator version and configured name.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: Operator is reachable and authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/whoami:
    get:
      operationId: core_get_whoami
      summary: Caller identity
      description: |
        Returns identity information for the authenticated caller.
        Returns 503 if auth is not yet configured.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: Caller identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Auth not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/capabilities:
    get:
      operationId: core_get_capabilities
      summary: What this airdress has turned on
      description: |
        Four booleans, and nothing else in the body. A client reads this
        to know which of its own surfaces to offer, and reads it again
        whenever a route answers `not_enabled`, because that answer means
        its picture is out of date.

        Readable by any principal on the airdress — owner, sub-user or
        machine — because the four values are the same four for all of
        them, and a client that knows in advance can explain itself
        instead of failing.

        The operator knows these four booleans and does not know why they
        are what they are. There is no plan name, no price and no upgrade
        wording here, and there will not be: that knowledge lives in the
        hub, which is where a client sends somebody who wants to change
        it.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The four switches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/maps/search:
    get:
      operationId: core_get_maps_search
      summary: Search the map through this operator
      description: |
        What the map's own search answers for a query, asked by this
        operator with the airdress's maps-scoped token (`[apps.maps]
        token`) at `[maps] front_url`. The token never leaves the
        operator. Read-only, for the owner and sub-users.

        Only `name`, `address`, `point` (`[lng, lat]`), `layer`,
        `credit` and, for an area, `osm` are passed on per result.
        `kind=area` keeps only areas the map can outline: an OSM
        relation in layer `locality`, `region` or `country`. `near` is
        coarsened to two decimals before it leaves the operator, and the
        query is never logged.

        At most 30 requests a minute per principal (both map routes
        together), never retried. A refusal is a closed kind:
        `maps_not_configured`, `maps_throttled`, `maps_unavailable`,
        `invalid_request`; never the map service's own body.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: near, in: query, required: false, description: '`<lat>,<lng>`', schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
        - {name: lang, in: query, required: false, schema: {type: string, enum: [en, de, fr]}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [place, area], default: place}}
      responses:
        '200':
          description: The results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsSearchAnswer'
        '400':
          description: '`invalid_request`: a parameter out of its range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: '`maps_throttled`: this principal''s minute is spent, or the map service''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'
        '502':
          description: '`maps_unavailable`: the map service did not answer usably.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'
        '503':
          description: '`maps_not_configured`: this operator has no maps token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'

  /v1/maps/layers:
    get:
      operationId: core_get_maps_layers
      summary: The map's views, modes, switches and layers
      description: |
        The map service's layer catalogue, as it answers it: views,
        modes, every switch the map address knows with its default, and
        each layer with its names and about texts in English and German.
        Same token, limit and refusals as `/v1/maps/search`.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: '`maps_throttled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'
        '502':
          description: '`maps_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'
        '503':
          description: '`maps_not_configured`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapsRefusal'

  /v1/apply:
    post:
      operationId: core_post_apply
      summary: Apply a resource manifest
      description: Create or update a resource from a manifest in YAML or JSON.
      tags: [core]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/ResourceManifest'
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceManifest'
      responses:
        '200':
          description: Resource applied (no change or synchronous completion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '202':
          description: Resource accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Invalid manifest.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable entity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/kinds:
    get:
      operationId: core_get_kinds
      summary: List resource kinds
      description: Returns all supported resource kind names.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: List of kinds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KindList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/events/catalog:
    get:
      operationId: core_get_event_catalog
      summary: The event catalogue
      description: |
        SPEC-150 FR-9. Every event type this operator records — name,
        version, audience (`owner`, `principal` or `airdress`), journal level,
        whether it is also an app-stream event, and the JSON Schema of its
        data. Generated from the binary; the same document is checked in as
        `crates/airdress-operator/events.catalog.json`. Owner or an enrolled
        machine, as for `/v1/apply`.
      tags: [core]
      security:
        - ownerAuth: []
        - machineSignature: []
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [catalog_version, events]
                properties:
                  catalog_version:
                    type: integer
                  events:
                    type: array
                    items:
                      type: object
                      required: [name, version, audience, level, bus, description, schema]
                      properties:
                        name: { type: string }
                        version: { type: integer }
                        audience: { type: string, enum: [owner, principal, airdress] }
                        level: { type: string }
                        client: { type: string }
                        bus: { type: boolean }
                        description: { type: string }
                        schema: { type: object }
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/events/signing-key:
    get:
      operationId: core_get_event_signing_key
      summary: The webhook signing key
      description: |
        SPEC-150 FR-38. The public half of the key event-subscription
        deliveries are signed with: `standardWebhooks` is the Standard
        Webhooks `whpk_` key a receiver verifies `v1a` with, `kid` the key id
        an RFC 9421 receiver looks up. A public key, served without
        authentication. 503 where event subscriptions are switched off.
      tags: [core]
      security: []
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [standardWebhooks, alg, kid, publicKey]
                properties:
                  standardWebhooks: { type: string, description: "whpk_ and base64" }
                  alg: { type: string, enum: [ed25519] }
                  kid: { type: string }
                  publicKey: { type: string, description: "base64, 32 bytes" }
        '503':
          description: Event subscriptions are switched off on this operator.

  /v1/event-subscriptions/{name}/redeliver:
    post:
      operationId: core_post_event_subscription_redeliver
      summary: Redeliver events to a subscription
      description: |
        SPEC-150 FR-37. Re-queues one event (`eventId`) or every event since a
        time (`since`, at most 10 000) for the named subscription — only the
        events it would have received, held to its types, audience and
        filter. The subscription's own principal only: the owner (for theirs
        and machines'), or a sub-user for their own (the name may be given
        without their prefix).
      tags: [core]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string, format: uuid }
                since: { type: string, format: date-time }
      responses:
        '202':
          description: Re-queued.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer }
        '400':
          description: Neither or both of eventId and since.
        '404':
          description: No such subscription of the caller's, or no such event for it.
        '409':
          description: The subscription is disabled.

  /v1/event-subscriptions/{name}/test:
    post:
      operationId: core_post_event_subscription_test
      summary: Send a test event to a subscription
      description: |
        SPEC-150 FR-37. Records a synthetic
        `airdress.event_subscription.test.sent` and queues it for this
        subscription only. Same callers as redeliver.
      tags: [core]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [eventId]
                properties:
                  eventId: { type: string, format: uuid }
        '404':
          description: No such subscription of the caller's.

  /v1/event-subscriptions/{name}/owner-disable:
    post:
      operationId: core_post_event_subscription_owner_disable
      summary: Switch a person's subscription off
      description: |
        SPEC-150 FR-79. The owner switches off a sub-user's subscription
        without reading where it points. The disable is kept beside the
        resource, not in its spec, so the person's own apply cannot clear it;
        it stands until lifted and is announced to the person — live, on
        their own devices' consent stream, as `event_subscription_block_changed`
        (`blocked: true`; lifting sends `blocked: false`). Owner only.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The disable as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [name, ownerDisabled]
                properties:
                  name: { type: string }
                  ownerDisabled: { type: boolean }
                  ownerDisabledAt: { type: [string, 'null'], format: date-time }
        '403':
          description: Not the owner.
        '404':
          description: No such subscription.
        '409':
          description: Not a sub-user's subscription.

  /v1/event-subscriptions/{name}/owner-lift:
    post:
      operationId: core_post_event_subscription_owner_lift
      summary: Lift the owner's disable
      description: |
        SPEC-150 FR-79. Lifts the owner's disable. Lifting never re-enables a
        subscription the person disabled themselves. Owner only.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The disable as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [name, ownerDisabled]
                properties:
                  name: { type: string }
                  ownerDisabled: { type: boolean }
                  ownerDisabledAt: { type: [string, 'null'], format: date-time }
        '403':
          description: Not the owner.
        '404':
          description: No such subscription.
        '409':
          description: Not a sub-user's subscription.

  /v1/kinds/{kind}:
    get:
      operationId: core_get_kind
      summary: List resources of a kind
      description: Returns all resources of the specified kind.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown kind.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/machines/enroll:
    post:
      operationId: machines_post_enroll
      summary: Start a machine's keypair enrollment
      description: |
        SPEC-095 FR-57. A machine that generated an Ed25519 key asks to enroll
        it under a display name. Unauthenticated, and limited to 5 a minute per
        source /64; at most 20 enrollments pend at once. The response has the
        shape of RFC 8628 §3.2. The `device_code` is a lookup handle, not a
        credential: a poll also needs a signature by the enrolling key.

        Mounted only when `[machines] enabled = true`; otherwise 404.
      tags: [machines]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, name]
              properties:
                public_key:
                  type: string
                  description: The machine's Ed25519 public key, base64url without padding.
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                preauth_key:
                  type: string
                  description: |
                    SPEC-098 FR-15…FR-18. A pre-auth key the owner minted
                    (`airdress_mk_…`). Redeeming one counts a use and skips the
                    anonymous pending cap. When the key is pre-approved, the
                    enrollment is approved at once with the key's grants, and the
                    first valid poll answers the machine id. Every refusal of
                    the key answers the same `401 access_denied`.
                purpose:
                  type: string
                  enum: [home-assistant, thing]
                  description: |
                    SPEC-098 G-2 (SPEC-116). What the machine enrolls for: shown
                    to the owner, and deciding what an approval may also link
                    it as (`home-assistant` → a `Home`, `thing` → a `Thing`,
                    SPEC-120). Absent for a plain machine; anything outside the
                    list is `400 invalid_request`.
                thing:
                  type: object
                  additionalProperties: false
                  description: |
                    SPEC-120 FR-32. What a thing announces about itself, only
                    with `purpose: thing`: shown to the owner verbatim before
                    approval, and what an approval's link declares. Names match
                    `[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?`; at most 32 events and
                    32 commands; `board`, `sdk` and `firmware` 1–64 characters.
                    Out of bounds, or without the purpose, is `400 invalid_request`.
                  properties:
                    board: { type: string, maxLength: 64 }
                    sdk: { type: string, maxLength: 64 }
                    firmware: { type: string, maxLength: 64 }
                    events:
                      type: array
                      maxItems: 32
                      items: { type: string }
                    commands:
                      type: array
                      maxItems: 32
                      items: { type: string }
      responses:
        '200':
          description: The enrollment. Show the owner `user_code` and `fingerprint`.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, expires_in, interval, fingerprint]
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                    example: WDJB-MJHT
                  expires_in:
                    type: integer
                    example: 600
                  interval:
                    type: integer
                    example: 5
                  fingerprint:
                    type: string
                    example: SHA256:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU
                  verification_uri:
                    type: string
                    format: uri
                    description: SPEC-098 FR-23. Where the owner approves; present when the operator knows its public origin.
                  verification_uri_complete:
                    type: string
                    format: uri
                    description: The same, naming this `user_code`. Still show the user code (RFC 8628 §3.3.1).
                  operator_key:
                    type: object
                    description: SPEC-098 FR-30. The key this operator signed the answer with.
                    required: [kid, public_key]
                    properties:
                      kid:
                        type: string
                      public_key:
                        type: string
                        description: Ed25519, base64url without padding.
                  operator_proof:
                    type: string
                    description: |
                      Ed25519 signature by `operator_key`, base64url, over
                      `airdress-machine-enroll-answer-v1\0`, the operator's
                      origin, 0x1F, `user_code`, 0x1F and the machine's public
                      key. The machine verifies it and shows the confirmation
                      code: SHA-256 of `airdress-machine-confirm-v1\0`, the
                      operator key, the machine key and `user_code`, first 100
                      bits in base32, five groups of four.
        '400':
          description: A malformed body, key or name (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'
        '401':
          description: |
            The pre-auth key was not accepted (`access_denied`): unknown, wrong,
            expired, revoked or used up. The answer does not say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'
        '409':
          description: The pre-auth key's grants no longer apply (`grant_template_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'
        '429':
          description: Too many enrollments from this network, or pending on this operator.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'

  /v1/machines/enroll/poll:
    post:
      operationId: machines_post_enroll_poll
      summary: Poll a machine enrollment
      description: |
        SPEC-095 FR-59. The machine presents its `device_code` and `proof`: a
        base64url Ed25519 signature by the enrolling key over
        `airdress-machine-enroll-v1\0` followed by the device code. Without a
        proof that verifies, every enrollment answers `invalid_grant`, so a
        captured device code reveals nothing.

        After the owner approves, the first poll answers the machine id and the
        kid of its key — never a bearer or a secret — and the enrollment is
        consumed. Before, `authorization_pending`; polled faster than
        `interval`, `slow_down`; after a denial or expiry, `access_denied` or
        `expired_token`.

        Mounted only when `[machines] enabled = true`; otherwise 404.
      tags: [machines]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, proof]
              properties:
                device_code:
                  type: string
                proof:
                  type: string
      responses:
        '200':
          description: Approved. The machine signs later requests with `keyid` `machine:<machine_id>#<kid>`.
          content:
            application/json:
              schema:
                type: object
                required: [machine_id, kid]
                properties:
                  machine_id:
                    type: string
                    format: uuid
                  kid:
                    type: string
                    example: k-0123456789abcdef
                  authorized_until:
                    type: [string, 'null']
                    format: date-time
                    description: |
                      SPEC-098 FR-8. Until when the owner's approval holds;
                      `null` when it does not expire. After it, every signed
                      request answers `401 machine_authorization_expired` until
                      the machine re-authenticates.
        '400':
          description: |
            An RFC 8628 §3.5 error: `authorization_pending`, `slow_down`,
            `access_denied`, `expired_token` or `invalid_grant`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'

  /v1/work/items:
    post:
      operationId: work_create_item
      summary: Create a task or an RFI
      description: |
        SPEC-182 FR-1, FR-2, FR-4. The caller is the asker. Assignees are
        people on this airdress (`kind: principal`); a group is refused
        `group_assignee_unsupported`. Numbers count per profile and are
        never reused. An RFI is created without its answer.
      tags: [work]
      security:
        - ownerAuth: []
      responses:
        '201':
          description: The item.
        '403':
          description: '`not_enabled` (`feature: work`).'
        '422':
          description: '`work_item_invalid` (with `details` per field), `group_assignee_unsupported` or `work_party_unknown`.'
    get:
      operationId: work_list_items
      summary: The caller's work items
      description: |
        SPEC-182 FR-25. `view` is `waiting` (open, assigned to me, oldest
        first), `mine`, `asked` or `all` (default; everything the caller may
        read). `before` pages by `updated`; `limit` 1–200, default 50.
      tags: [work]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: '`{"items": [...]}`.'
        '403':
          description: '`not_enabled` (`feature: work`).'
  /v1/work/items/{id}:
    get:
      operationId: work_get_item
      summary: One work item
      description: |
        SPEC-182 FR-10. A place's access text is included for the people
        who may read the item, and nowhere else.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The item.
        '403':
          description: '`not_enabled` (`feature: work`), `work_item_forbidden` or `work_transition_refused`.'
        '404':
          description: '`work_item_not_found`: no such item, or not the caller''s to read.'
    patch:
      operationId: work_change_item
      summary: Change a work item's fields
      description: |
        SPEC-182 FR-11. The asker or the owner, from the version they read:
        `basedOn` is the `updated` they saw, and an older one is refused
        `409 work_item_stale`. A JSON merge patch over title, description,
        due, priority, place, assignees, watchers, links and the RFI's
        question, references, proposed answer and reply-by. Status moves
        only through `/status`, the answer only through `/answer`.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The changed item.
        '400':
          description: '`work_item_bad_request`: a field that cannot be changed here.'
        '403':
          description: '`not_enabled` (`feature: work`), `work_item_forbidden` or `work_transition_refused`.'
        '404':
          description: '`work_item_not_found`: no such item, or not the caller''s to read.'
        '409':
          description: '`work_item_stale`, with `details.current`.'
  /v1/work/items/{id}/status:
    post:
      operationId: work_set_status
      summary: Move a work item to another status
      description: |
        SPEC-182 design D-2. A task: an assignee or the owner works it, the
        asker or the owner cancels or reopens it. An RFI: the asker closes
        or voids it. A refused move is `work_transition_refused`.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The item.
        '403':
          description: '`not_enabled` (`feature: work`), `work_item_forbidden` or `work_transition_refused`.'
        '404':
          description: '`work_item_not_found`: no such item, or not the caller''s to read.'
        '409':
          description: '`work_transition_refused`: no such move.'
  /v1/work/items/{id}/answer:
    post:
      operationId: work_answer_rfi
      summary: Give an RFI its official answer
      description: |
        SPEC-182 FR-4. An assignee or the owner, once; the RFI becomes
        `answered`. `costImpact` and `scheduleImpact` are `none`,
        `possible` or `yes`. A second answer is `409 answer_exists`.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The answered RFI.
        '403':
          description: '`not_enabled` (`feature: work`), `work_item_forbidden` or `work_transition_refused`.'
        '404':
          description: '`work_item_not_found`: no such item, or not the caller''s to read.'
        '409':
          description: '`answer_exists`.'
  /v1/work/items/{id}/history:
    get:
      operationId: work_get_history
      summary: A work item's history
      description: |
        SPEC-182 FR-5. Append-only, oldest first: who changed what, when.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: '`{"entries": [...]}`.'
        '403':
          description: '`not_enabled` (`feature: work`), `work_item_forbidden` or `work_transition_refused`.'
        '404':
          description: '`work_item_not_found`: no such item, or not the caller''s to read.'
  /v1/work/items/{id}/conversation:
    post:
      operationId: work_open_conversation
      summary: Open a work item's own thread
      description: |
        SPEC-182 FR-6 (182-B.4). Opens, or returns, the caller's row of the
        item's thread: `{"conversationId", "created"}`. One thread per item,
        shared by its people and kept as one row per member; a message sent
        in it reaches every member under their own key, its sender recorded.
        Only the item's people (and the owner) have a row: anyone else gets
        `404`, as does someone taken off the item.
      tags: [work]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The caller's existing row.
        '201':
          description: The caller's row, opened now.
        '403':
          description: '`not_enabled` (`feature: work`).'
        '404':
          description: '`work_item_not_found`.'
  /v1/shells:
    get:
      operationId: shells_list
      summary: A person's shell hosts, with their sessions
      description: |
        SPEC-137 §5.1 (D-25). The overview: the caller's own hosts, each with
        its `machine` id (the second id the E2E prologue binds), its
        conditions, the profiles the machine published (status, never a
        definition), and its sessions with their states. Read-only. Action
        `Attach`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: 'No device bearer.'
        '403':
          description: '`not_enabled` (`feature: shells`), or `shell_caller_not_eligible`: not an enrolled human device.'
  /v1/shells/audit:
    get:
      operationId: shells_get_audit
      summary: The audit of a person's own shell hosts
      description: |
        SPEC-137 §11. Session metadata and events for the caller's own hosts:
        who, which device, which profile, start, end, ciphertext byte counts and
        exit status. Never content. `limit` 1–1000, default 100.
      tags: [shells]
      security:
        - enrollmentAuth: []
      responses:
        '200':
          description: OK
        '403':
          description: '`not_enabled` or `shell_caller_not_eligible`.'
  /v1/shells/device-keys:
    post:
      operationId: shells_post_device_keys
      summary: Register this device's shell keys
      description: |
        SPEC-137 §6.2. Body `{dhPublic, presencePublic, presenceAlg, sig}`: an
        X25519 key, a P-256 presence key (or none), and an Ed25519 signature by
        the device's own identity key over `"airdress.shell.device-keys.v1" ‖
        0x00 ‖ device id ‖ dhPublic ‖ presenceAlg ‖ 0x00 ‖ presencePublic`.
        `presenceAlg: none` only from a delegation-only device of kind `cli`
        (D-30).
      tags: [shells]
      security:
        - enrollmentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dhPublic:
                  type: string
                presencePublic:
                  type: string
                presenceAlg:
                  type: string
                sig:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: 'A malformed key or signature.'
        '409':
          description: '`shell_presence_none_not_allowed`.'
        '422':
          description: '`shell_keys_signature_invalid`.'
  /v1/shells/introductions:
    post:
      operationId: shells_post_introductions
      summary: Introduce another device of the same person to their hosts
      description: |
        SPEC-137 §6.3 step 5. Body `{device, deviceKind, sig}`: the introducing
        device's identity signature over `"airdress.shell.introduction.v1" ‖
        0x00 ‖ introducer ‖ introduced ‖ introduced identity key ‖ deviceKind`.
        Relayed to the person's hosts in a signed `introduce` frame; the host
        decides.
      tags: [shells]
      security:
        - enrollmentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                device:
                  type: string
                deviceKind:
                  type: string
                sig:
                  type: string
      responses:
        '200':
          description: OK
        '404':
          description: '`shell_device_not_found`: not a live device of the caller''s person.'
        '422':
          description: '`shell_introduction_signature_invalid`.'
  /v1/shells/{host}:
    get:
      operationId: shells_get_host
      summary: One of a person's shell hosts
      description: |
        SPEC-137 §5.1. One host, sessions included. Another person's host
        answers as one that does not exist (FR-A5).
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: '`shell_host_not_found`.'
  /v1/shells/{host}/sessions:
    post:
      operationId: shells_post_session
      summary: Open a session by profile id
      description: |
        SPEC-137 §5.1, §7.3. Body `{session?, profile, cols, rows, handshake}`
        (Noise message 1, base64). `session` is the id the device proposes,
        because the Noise prologue binds it (§6.5): a UUID that no session
        has used, or `409 shell_session_exists`; absent, the operator picks
        one. A profile id only — never a program, an argument, a directory
        or an environment (FR-P2). Answers `202 {session, leg}`; the host's
        reply arrives on the leg. Action `Open`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                session:
                  type: string
                  format: uuid
                profile:
                  type: string
                cols:
                  type: integer
                rows:
                  type: integer
                handshake:
                  type: string
      responses:
        '202':
          description: OK
        '404':
          description: '`shell_host_not_found` or `shell_profile_unknown`.'
        '409':
          description: '`shell_profile_invalid`, `shell_host_disabled`, `shell_device_keys_missing` or `shell_session_exists`.'
        '429':
          description: '`shell_session_limit`, `shell_viewer_limit`, `shell_leg_limit` or `rate_limited`.'
        '503':
          description: '`shell_host_offline`.'
  /v1/shells/sessions/{id}/legs:
    post:
      operationId: shells_post_leg
      summary: Attach to a session again, or resume within a live leg
      description: |
        SPEC-137 §6.5. Body `{handshake}` (Noise IK, a reattach) or `{resume:
        {ticketId, handshake}}` (IKpsk2). Answers `202 {leg}`. Action `Attach`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: OK
        '404':
          description: '`shell_session_not_found`.'
        '429':
          description: '`shell_viewer_limit` or `shell_leg_limit`.'
        '503':
          description: '`shell_host_offline`.'
  /v1/shells/sessions/{id}/input:
    post:
      operationId: shells_post_input
      summary: Take input in one session
      description: |
        SPEC-137 §5.6 (D-25). Body `{leg}`: the caller's leg on this one
        session. Releases the device's input in any other session, on any host,
        first. Action `Input`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                leg:
                  type: string
      responses:
        '200':
          description: OK
        '404':
          description: '`shell_session_not_found`.'
  /v1/shells/sessions/{id}:
    delete:
      operationId: shells_delete_session
      summary: Close a session
      description: |
        SPEC-137 §5.1. The host sends the process group SIGHUP, then SIGKILL.
        Action `Open`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: OK
        '404':
          description: '`shell_session_not_found`.'
        '503':
          description: '`shell_host_offline`.'
  /v1/shells/legs/{leg}/stream:
    get:
      operationId: shells_get_leg_stream
      summary: A leg as a WebSocket
      description: |
        SPEC-137 §8.4. Subprotocol `airdress.shell.v1`. One binary message is
        one end-to-end record each way, sent at once. Every record the leg
        buffered before the socket attached (the host's message 2 among them)
        is written first. The leg is bound to the device and bearer that
        created it.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: leg
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '400':
          description: '`subprotocol_required`.'
        '404':
          description: '`shell_leg_not_found`.'
  /v1/shells/legs/{leg}/events:
    get:
      operationId: shells_get_leg_events
      summary: A leg's records as server-sent events
      description: |
        SPEC-137 §8.4. Each event is one record, base64, with its number as the
        id; `Last-Event-ID` resumes. A final `closed` event carries `{code,
        reason}`.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: leg
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: '`shell_leg_not_found`.'
  /v1/shells/legs/{leg}/frames:
    post:
      operationId: shells_post_leg_frames
      summary: Records up a leg
      description: |
        SPEC-137 §8.4. Body `{records}`: one to sixteen base64 records, flushed
        by the client within 10 ms.
      tags: [shells]
      security:
        - enrollmentAuth: []
      parameters:
        - name: leg
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                records:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK
        '404':
          description: '`shell_leg_not_found`.'
        '503':
          description: '`shell_host_offline`.'
  /v1/shells/host/session:
    get:
      operationId: shells_get_host_session
      summary: A shell host's held channel, as a WebSocket
      description: |
        SPEC-137 §8.1. Machine-signed upgrade offering `airdress.shell-host.v1`.
        Signed operator frames (domain `airdress-shell-`) are text; `data`
        frames are binary with a fixed header (version, type, session id, leg
        id, length). Admitted only for a machine a linked, enabled `ShellHost`
        names. Close codes: SPEC-116's, plus 4010 disabled.
      tags: [shells]
      security:
        - machineSignature: []
      responses:
        '200':
          description: OK
        '400':
          description: '`subprotocol_required`.'
        '403':
          description: '`not_enabled`, `shell_host_not_linked` or `shell_host_disabled`.'
  /v1/shells/host/poll:
    post:
      operationId: shells_post_host_poll
      summary: A shell host's held channel, as a long-poll
      description: |
        SPEC-137 §8.1. Body `{session, ack}`. NDJSON of signed frames and
        keepalives, rotated by the host under the relay's idle timeout; `data`
        lines carry base64 records.
      tags: [shells]
      security:
        - machineSignature: []
      responses:
        '200':
          description: OK
        '403':
          description: '`not_enabled`, `shell_host_not_linked` or `shell_host_disabled`.'
  /v1/shells/host/frames:
    post:
      operationId: shells_post_host_frames
      summary: Frames up a shell host's long-poll
      description: |
        SPEC-137 §8.1. NDJSON of host frames (a closed set) and `ack` lines,
        `?session=<id>`.
      tags: [shells]
      security:
        - machineSignature: []
      responses:
        '200':
          description: OK
        '400':
          description: '`protocol`: the channel is closed.'
        '404':
          description: '`session_unknown`.'
  /v1/shells/host/devices:
    get:
      operationId: shells_get_host_devices
      summary: The host's person's devices that registered shell keys
      description: |
        SPEC-137 §6.3, first-device trust. Machine-signed, by a machine a sound
        `ShellHost` link names (switched on or not). Scoped to that host's
        person, taken from the link and never from the request: no other
        person's device is ever listed. Per device: `device`, `kind`, `label`,
        `identityPublic` and `identityFingerprint` (what `trust` compares),
        `shellKey` (fingerprint) and `shellKeyPublic`, `presenceAlg`,
        `createdAt`, `lastSeenAt`. Fingerprints are `SHA256:` and unpadded
        base64 of the raw key. The host still decides trust itself.
      tags: [shells]
      security:
        - machineSignature: []
      responses:
        '200':
          description: '`{shellHost, principal, devices: [...]}`.'
        '401':
          description: '`machine_signature_required`.'
        '403':
          description: '`not_enabled` or `shell_host_not_linked`.'
        '503':
          description: '`unavailable`.'
  /v1/admin/grants:
    get:
      operationId: admin_grants_list
      summary: Resource grants, newest first
      description: |
        SPEC-184 FR-32. The grants the host CLI writes, over HTTP, for the
        console. Owner only (not on the sub-user allowlist).
      tags: [admin]
      security:
        - ownerAuth: []
        - hubAccessToken: []
      parameters:
        - name: principal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: include_revoked
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: '`{grants: [Grant]}`.'
        '401':
          description: 'No owner token.'
        '403':
          description: 'Not the owner (`sub_user_forbidden`).'
    post:
      operationId: admin_grants_create
      summary: Grant a principal actions on a resource
      description: |
        SPEC-184 FR-32, through the same store as `airdress-operator grants
        create`; attributed `client:<client_id>:<sub>` for a hub access
        token. A destructive write: a console token (`operator.admin`) needs
        a sign-in within `[auth.step_up] max_age_secs` (RFC 9470).
      tags: [admin]
      security:
        - ownerAuth: []
        - hubAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principal_id, kind, actions]
              properties:
                principal_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  description: A Kind name, or `*` for every Kind.
                resource:
                  type: string
                  description: Omit for every resource of the Kind.
                actions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The grant.
        '400':
          description: '`unknown_action` or `invalid_grant`.'
        '401':
          description: 'No owner token, or `insufficient_user_authentication` (step-up).'
        '403':
          description: 'Not the owner.'
        '404':
          description: '`principal_not_found`.'
        '409':
          description: '`principal_not_grantable`, `principal_revoked` or `already_granted`.'
  /v1/admin/grants/{id}:
    delete:
      operationId: admin_grants_revoke
      summary: Revoke a grant
      description: |
        SPEC-184 FR-32. Idempotent (`already_revoked`). Takes effect on the
        next request. A destructive write (step-up, as for create).
      tags: [admin]
      security:
        - ownerAuth: []
        - hubAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: '`{grant, already_revoked}`.'
        '401':
          description: 'No owner token, or `insufficient_user_authentication` (step-up).'
        '403':
          description: 'Not the owner.'
        '404':
          description: '`grant_not_found`.'
  /v1/admin/shells:
    get:
      operationId: shells_admin_list
      summary: Every shell host on this airdress, as metadata
      description: |
        SPEC-137 §5.3 (D-27). Each host's person, who approved it, conditions,
        profile and session counts, the root warning and last seen. Never a
        profile or a session's content. Owner OIDC.
      tags: [shells]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: 'No owner token.'
        '403':
          description: 'Not the owner, or `not_enabled`.'
  /v1/admin/shells/audit:
    get:
      operationId: shells_admin_audit
      summary: Every shell session's audit metadata
      description: |
        SPEC-137 §11. Owner OIDC.
      tags: [shells]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: OK
        '403':
          description: 'Not the owner.'
  /v1/admin/shells/{host}/revoke:
    post:
      operationId: shells_admin_revoke
      summary: Revoke a shell host
      description: |
        SPEC-137 §5.3. Revokes the machine, then deletes the `ShellHost`, so the
        host hears `revoked` (4003). Owner OIDC, or an owner device under
        `[machines] owner_devices_may_revoke`. The whole of the owner's power
        over another person's host.
      tags: [shells]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '403':
          description: 'Not the owner.'
        '404':
          description: '`shell_host_not_found`.'
  /v1/admin/events/load:
    post:
      operationId: events_admin_load_start
      summary: Start a synthetic event load run
      description: |
        SPEC-150 NFR-2. The operator emits `rate` synthetic events a second for
        `durationSeconds` through its own event engine, so the log's throughput
        can be read from `/metrics` (`airdress_events_queue_depth`,
        `airdress_events_sink_lag`, `airdress_events_dispatch_delay_seconds`)
        without HTTP in the way. The events are
        `airdress.event_load.tick.emitted`, off the bus. Owner only (a human
        owner principal), off unless `[events.load] enabled`, one run at a
        time. Hard caps: rate 1–2000, duration 1–600 s, rate × duration at
        most 300,000, payloadBytes at most 1024 (default 128).
      tags: [admin]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rate, durationSeconds]
              properties:
                rate: { type: integer, minimum: 1, maximum: 2000 }
                durationSeconds: { type: integer, minimum: 1, maximum: 600 }
                payloadBytes: { type: integer, minimum: 0, maximum: 1024 }
      responses:
        '202':
          description: 'The run: `{run, rate, durationSeconds, payloadBytes, events, startedAt, emitted, queueDepthMax, state}`.'
        '400':
          description: '`out_of_bounds`.'
        '401':
          description: 'No principal.'
        '403':
          description: '`owner_only` or `not_enabled`.'
        '409':
          description: '`load_running` or `events_disabled`.'
    get:
      operationId: events_admin_load_status
      summary: The switch, the caps, the current or last run, and the queue
      description: |
        SPEC-150 NFR-2. `{enabled, limits, run, engine}`; `engine` is the event
        engine's counters and queue depth as of now. Owner only.
      tags: [admin]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      responses:
        '200':
          description: OK
        '403':
          description: '`owner_only`.'
    delete:
      operationId: events_admin_load_stop
      summary: Stop the running synthetic event load run
      description: |
        SPEC-150 NFR-2. Allowed with the switch off. Owner only.
      tags: [admin]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      responses:
        '200':
          description: The run, stopping.
        '403':
          description: '`owner_only`.'
        '404':
          description: '`no_run`.'
  /v1/things/self:
    get:
      operationId: things_get_self
      summary: A thing reads what this operator holds it to
      description: |
        SPEC-120. The calling thing's name, declared event types and limits
        (`perMinute`, `burst` 20, `backlogPerMinute` — `perMinute` times the
        operator's `[things] backlog_multiplier`, 10 by default —
        `totalPerMinute` — live and backlog together, `perMinute +
        backlogPerMinute` held to `[things] max_total_events_per_minute`
        (6,600 by default), the rate the events route actually enforces —
        `maxBodyBytes`, `maxPerRequest` 32), all under `events`; commands,
        channel mode, and
        `serverTime` (unix seconds; for deciding to resync, never for setting
        a clock).

        Machine-signed. Admitted only for a machine a live, enabled `Thing`
        names: otherwise `403 thing_not_linked` or `thing_disabled`. Mounted
        only with `[things] enabled` (and `[machines] enabled`).
      tags: [things]
      security:
        - machineSignature: []
      responses:
        '200':
          description: The thing, as this operator holds it.
        '401':
          description: >-
            No machine signature, or `signature_clock_skew` with `serverTime`
            when `created` is outside ±300 s or the signature has expired.
        '403':
          description: '`thing_not_linked` or `thing_disabled`.'
  /v1/things/self/events:
    post:
      operationId: things_post_events
      summary: A thing publishes events under its own signature
      description: |
        SPEC-120 FR-19…FR-22. Body `{"events":[{id, type, time?, data}],
        "dropped"?: n}`, at most 32 events and the `Thing`'s `maxBodyBytes`.
        Each event is decided on its own: `invalid_event` (no id of 1–128
        characters), `unknown_type` (not declared on the `Thing`),
        `invalid_data` (not an object), `invalid_time` (not RFC 3339), or
        `rate_limited`. A repeat of an id accepted in the last hour is
        answered as accepted and listed in `duplicates`; nothing is published
        again. An event whose `time` is more than 10 s older than receipt is
        backlog and spends a separate budget of `[things] backlog_multiplier`
        (default 10) times the live rate, burst likewise; live and backlog
        together are held to `[things] max_total_events_per_minute` (default
        6,600).

        Each accepted event becomes a CloudEvent `dev.airdress.thing.<type>`,
        source `thing/<name>`, with the device's `id` and `time` (else
        receipt), and the extensions `airdressthing` and `airdressreceived`
        (this operator's receipt time), delivered to functions bound with
        `spec.events.source: thing`. The answer is `200` with `accepted`,
        `duplicates`, `refused`, `retryAfter` (seconds, and a `Retry-After`
        header, when anything was rate-limited) and `receivedAt`.
      tags: [things]
      security:
        - machineSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              additionalProperties: false
              properties:
                events:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [id, type, data]
                    properties:
                      id: { type: string, maxLength: 128 }
                      type: { type: string }
                      time: { type: string, format: date-time }
                      data: { type: object }
                dropped:
                  type: integer
                  minimum: 0
                  description: Events the device dropped from its own queue.
      responses:
        '200':
          description: Each event's outcome.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, refused, retryAfter, receivedAt]
                properties:
                  accepted: { type: array, items: { type: string } }
                  duplicates: { type: array, items: { type: string } }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: [string, 'null'] }
                        reason:
                          type: string
                          enum: [invalid_event, unknown_type, invalid_data, invalid_time, rate_limited]
                  retryAfter: { type: [integer, 'null'] }
                  receivedAt: { type: string, format: date-time }
        '400':
          description: '`invalid_request` or `too_many_events`.'
        '401':
          description: No machine signature, or `signature_clock_skew`.
        '403':
          description: '`thing_not_linked` or `thing_disabled`.'
        '413':
          description: '`body_too_large`: over the Thing''s `maxBodyBytes`.'
  /v1/things/self/poll:
    post:
      operationId: things_post_poll
      summary: A thing's command channel, downstream, as a streaming long-poll
      description: |
        SPEC-120 FR-25, FR-29. Body `{"session": <id>|null, "ack": <seq>|null,
        "wait": null|0}`. Answers `application/x-ndjson`: operator frames
        `{"type","frame","sig"}` — `hello`, `command`, `cancel` — signed by the
        operator's `http_signing` key (the one pinned at enrollment) over
        `"airdress-thing-" ‖ type ‖ "-v1" ‖ 0x00 ‖ frame`, and a
        `{"type":"keepalive"}` line every 30 s. Without a live session it opens
        one and the first frame is its `hello`; with one it attaches, writes
        again every frame after `ack`, and ends the previous poll. The device
        rotates every 240 s, opening the next poll before it stops reading the
        last, and drops any `seq` it has seen. `wait: 0` (wake mode) writes
        what is pending and ends. One session per machine; a second displaces
        the first. A session lives at most an hour, ends 90 s after its last
        poll detached, and ends within a second of the machine's revocation or
        its `Thing` being disabled or deleted.
      tags: [things]
      security:
        - machineSignature: []
      responses:
        '200':
          description: The frame stream.
          content:
            application/x-ndjson: {}
        '400':
          description: '`invalid_request`.'
        '401':
          description: No machine signature, or `signature_clock_skew`.
        '403':
          description: '`thing_not_linked` or `thing_disabled`.'
        '409':
          description: >-
            `channel_off` (the Thing has no channel) or `channel_mode_wake`
            (it polls with `wait: 0`).
  /v1/things/self/frames:
    post:
      operationId: things_post_frames
      summary: A thing's answers, upstream, for its session
      description: |
        SPEC-120 FR-28. NDJSON of `{"type":"result","commandId","outcome",
        "result","deviceMs"}` (outcome `ok`, `rejected`, `unknown_command`,
        `busy`, `failed` or `expired`; `result` an object or null, at most
        1 KiB), `{"type":"ack","seq":n}` and `{"type":"keepalive"}`, for the
        session named in the query. Any other line closes the session.
      tags: [things]
      security:
        - machineSignature: []
      parameters:
        - name: session
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: '`{"accepted": <lines>}`'
        '400':
          description: '`protocol`; the session is closed.'
        '403':
          description: '`thing_not_linked` or `thing_disabled`.'
        '404':
          description: '`session_unknown`; open a new poll.'
  /v1/home/session:
    get:
      operationId: home_get_session
      summary: A home hub's held channel, as a WebSocket
      description: |
        SPEC-116 transport candidate W. A machine-signed WebSocket upgrade
        offering the `airdress.home.v1` subprotocol. The operator's first
        frame is a signed `hello`; afterwards signed operator frames and hub
        frames flow both ways. Pings every 30 s from both sides; closed after
        90 s with nothing received. Close codes: 4001 re-dial, 4008 displaced
        by a newer channel of the same machine, 4009 protocol.

        Mounted only with `[home] enabled` (and `[machines] enabled`), and
        only for a machine linked as a home; otherwise `403 home_not_linked`.
      tags: [home]
      security:
        - machineSignature: []
      responses:
        '101':
          description: Switching to the channel.
        '200':
          description: >-
            Not answered by a WebSocket-capable client: the upgrade answers
            101. Listed because OpenAPI has no other way to name a success.
        '400':
          description: '`subprotocol_required`.'
        '401':
          description: No machine signature.
        '403':
          description: '`home_not_linked`.'
  /v1/home/poll:
    post:
      operationId: home_post_poll
      summary: A home hub's held channel, downstream, as a streaming long-poll
      description: |
        SPEC-116 transport candidate P. Body `{"session": <id>|null, "ack": <seq>}`.
        Answers `application/x-ndjson` held open: signed operator frames and a
        `keepalive` line every 30 s. Without a live session it opens one and
        the first line is its `hello`. With one, it attaches this poll, writes
        again every frame after `ack`, and ends the previous poll. The hub
        rotates the poll every 240 s, opening the next before it stops reading
        the last, and drops any `seq` it has seen.
      tags: [home]
      security:
        - machineSignature: []
      responses:
        '200':
          description: The frame stream.
          content:
            application/x-ndjson: {}
        '401':
          description: No machine signature.
        '403':
          description: '`home_not_linked`.'
  /v1/home/frames:
    post:
      operationId: home_post_frames
      summary: A home hub's frames, upstream, for a long-poll session
      description: |
        SPEC-116 transport candidate P. NDJSON of hub frames (`result`,
        `read_result`, `shared`, `state`, `entity_event`, `notify`) and an
        optional `{"type":"ack","seq":n}` line, for the session named in the
        query. A line outside the frame set closes the session.
      tags: [home]
      security:
        - machineSignature: []
      parameters:
        - name: session
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: '`{"accepted": <lines>}`'
        '400':
          description: '`protocol`; the session is closed.'
        '404':
          description: '`session_unknown`; open a new poll.'
  /v1/machines/reauth:
    post:
      operationId: machines_post_reauth
      summary: A machine asks to be approved again
      description: |
        SPEC-098 FR-4…FR-6. Signed by one of the machine's `machine_api` keys,
        this opens an enrollment of that key linked to the machine, and answers
        exactly as `POST /v1/machines/enroll` does. It is the one route a
        machine whose authorization has expired may reach. A second request
        supersedes a pending one. The machine polls
        `POST /v1/machines/enroll/poll` as usual; once the owner approves, the
        poll answers the same machine id and kid with a new `authorized_until`.
        The machine keeps its id, key and grants.

        Mounted only when `[machines] enabled = true`; otherwise 404.
      tags: [machines]
      security:
        - machineSignature: []
      responses:
        '200':
          description: The re-authentication. Show the owner `user_code` and `fingerprint`.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, expires_in, interval, fingerprint]
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                    example: WDJB-MJHT
                  expires_in:
                    type: integer
                    example: 600
                  interval:
                    type: integer
                    example: 5
                  fingerprint:
                    type: string
        '401':
          description: No machine signature, one that did not verify, or a revoked machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'
        '429':
          description: No user code could be drawn; try again shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineEnrollmentError'

  /v1/admin/machines:
    get:
      operationId: machines_admin_list
      summary: List enrolled machines
      description: |
        SPEC-098 FR-26. Every machine, revoked ones included, with its fingerprint
        and `authorization` (a MachineAuthorization). Never key bytes.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/enrollments:
    get:
      operationId: machines_admin_list_enrollments
      summary: List pending machine enrollments
      description: |
        SPEC-098 FR-26. Each has `user_code`, `name`, `fingerprint`, `kind` (`new`
        or `reauth`), `machine_id` (for a re-authentication), `preauth_key_id`,
        `confirmation_code` (when the answer was signed), `created_at` and
        `expires_at`. Compare the fingerprint or the code with the one the
        machine printed before approving.

        SPEC-098 G-2 (SPEC-116): also `purpose` (`home-assistant`, `thing` or
        null) and `links`, the Kinds an approval may link this enrollment as on
        this operator (`["Home"]`, `["Thing"]`, or `[]` when the Kind is not
        registered or the enrollment is a re-authentication). SPEC-120: `thing`,
        what a thing announced (board, sdk, firmware, events, commands), or null.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/enrollments/{user_code}/approve:
    post:
      operationId: machines_admin_approve
      summary: Approve a pending machine enrollment
      description: |
        SPEC-098 FR-26, FR-27. The body must carry the fingerprint the machine
        printed; the operator compares it with the key the enrollment holds and
        refuses on a mismatch, leaving the enrollment pending. There is no way to
        approve without a comparison. A re-authentication renews the same machine.
        Attributed `owner-oidc:<sub>`.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      parameters:
        - name: user_code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `fingerprint` or `confirmation_code`.
              properties:
                fingerprint:
                  type: string
                  example: SHA256:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU
                confirmation_code:
                  type: string
                  description: SPEC-098 FR-32. The code the machine printed; case, spaces and hyphens are forgiven.
                link:
                  type: object
                  additionalProperties: false
                  required: [kind, name]
                  description: |
                    SPEC-098 G-2 (SPEC-116). Also link the machine as a resource
                    of `kind`, named `name` (a DNS label), applied with the
                    Kind's defaults and attributed to the approver. Only a kind
                    the listing's `links` offers; otherwise `422
                    link_unavailable`, and a name already taken is `409
                    link_name_taken` — both before anything is approved.
                  properties:
                    kind:
                      type: string
                      example: Home
                    name:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                      example: home
      responses:
        '200':
          description: 'Approved: `machine_id`, `name`, `kid`, `fingerprint`, `kind`, `authorization`, and the `grants` a pre-auth key applied. With a `link`, also `link {kind, name}` — or `link {kind, name, error}` when the machine was approved but the resource could not be applied.'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '404':
          description: No pending enrollment has that user code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '410':
          description: The enrollment expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '422':
          description: No fingerprint, or one that does not match (`confirmation_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/enrollments/{user_code}/deny:
    post:
      operationId: machines_admin_deny
      summary: Deny a pending machine enrollment
      description: |
        SPEC-098 FR-26. The machine's next poll answers `access_denied`.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      parameters:
        - name: user_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Denied.
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '404':
          description: No pending enrollment has that user code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/{machine_id}/revoke:
    post:
      operationId: machines_admin_revoke
      summary: Revoke a machine
      description: |
        SPEC-098 FR-26. Revokes the machine principal and every key it holds; its
        next request is refused.

        SPEC-112 D-13: when the machine holds a key that signs function source,
        `source_signing` is required and says whether that key was `rotated`
        (versions it signed keep running and stay valid rollback targets) or
        `compromised` (they stop serving). Without it the request is refused
        with 409 and nothing is revoked.

        Owner's OIDC token. SPEC-098 G-4 (SPEC-116): with `[machines]
        owner_devices_may_revoke = true`, also a device bearer whose principal
        is the owner (attributed `owner-device:<enrollment id>`); a sub-user's
        device is 403. This is the only admin route a device bearer reaches.
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                source_signing:
                  type: string
                  enum: [rotated, compromised]
      responses:
        '200':
          description: 'Revoked: `machine_id` and `revoked_kids`.'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '404':
          description: No live machine has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '409':
          description: The machine holds a source-signing key and `source_signing` was not sent; nothing was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/{machine_id}/authorization:
    put:
      operationId: machines_admin_set_authorization
      summary: Set a machine's authorization expiry
      description: |
        SPEC-098 FR-7. Send exactly one of `expires_in_secs` (at most 400 days) or
        `expiry_disabled: true`. The machine's own actions never move its expiry;
        only this, an approval, or the approval of its re-authentication do.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      parameters:
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in_secs:
                  type: integer
                  minimum: 1
                expiry_disabled:
                  type: boolean
      responses:
        '200':
          description: '`machine_id` and the new `authorization`.'
          content:
            application/json:
              schema:
                type: object
                required: [machine_id, authorization]
                properties:
                  machine_id:
                    type: string
                    format: uuid
                  authorization:
                    $ref: '#/components/schemas/MachineAuthorization'
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '404':
          description: No live machine has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/preauth-keys:
    get:
      operationId: machines_admin_list_preauth_keys
      summary: List pre-auth keys
      description: |
        SPEC-098 FR-19. Every key with its `state` (`live`, `revoked`, `expired`,
        `used up`), uses, pre-approval, grant template and expiry. Never a secret
        or a hash.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
    post:
      operationId: machines_admin_create_preauth_key
      summary: Mint a pre-auth key
      description: |
        SPEC-098 FR-12…FR-14. Returns `id`, `key` and `expires_at`; this answer is
        the only time the key exists outside the machine that will use it. Defaults:
        one hour, one use, not pre-approved, no grants (a machine it enrolls can
        reach nothing). At most 90 days and 100 uses; a reusable pre-approved key at
        most 24 hours. `authorization_lifetime_secs: 0` means machines it enrolls do
        not expire.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              additionalProperties: false
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 128
                expires_in_secs:
                  type: integer
                  minimum: 1
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 100
                pre_approved:
                  type: boolean
                grants:
                  type: array
                  items:
                    $ref: '#/components/schemas/MachineGrantTemplate'
                authorization_lifetime_secs:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: The key, shown once.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /v1/admin/machines/preauth-keys/{key_id}/revoke:
    post:
      operationId: machines_admin_revoke_preauth_key
      summary: Revoke a pre-auth key
      description: |
        SPEC-098 FR-19, FR-20. Refuses further redemptions at once. Machines the
        key already enrolled are untouched.

        Owner only, with the owner's OIDC token (a device bearer is refused).
        Mounted only when `[machines] enabled = true` and owner OIDC is configured.
      tags: [machines]
      security:
        - ownerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked.
        '400':
          description: A malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '401':
          description: No owner OIDC token, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '403':
          description: A valid token for someone other than the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'
        '404':
          description: No unrevoked pre-auth key has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineAdminError'

  /machines/approve:
    get:
      operationId: machines_get_approve_page
      summary: Where a machine's login link lands
      description: |
        SPEC-098 FR-25. A static page that shows the user code from the link
        and says how to approve it, with the warning to approve only a machine
        in your possession. It fetches nothing and reveals nothing about any
        enrollment. Mounted when `[machines] enabled = true`.

        SPEC-098 G-1 (SPEC-116): with `[machines.approve] oidc_client_id`, the
        page also signs the owner in (authorization code + PKCE against
        `[auth] issuer`, redirect URI `<public origin>/machines/approve`), keeps
        the token in memory only, and approves or denies over the owner routes
        above. Its CSP then admits `connect-src 'self' <issuer origin>` and
        nothing else. The HTML is the same for every user code either way.
      tags: [machines]
      security: []
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string

  /m/{user_code}:
    get:
      operationId: machines_get_short_link
      summary: A short approval link, for a QR on a small display
      description: |
        SPEC-120 FR-37. `302` to `/machines/approve?user_code=<code>` when the
        path holds a well-formed user code, else to `/machines/approve`. The
        same answer whatever the code, unauthenticated like the page itself.
      tags: [machines]
      security: []
      parameters:
        - name: user_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: To the approve page.
  /M/{user_code}:
    get:
      operationId: machines_get_short_link_upper
      summary: The short approval link, upper case
      description: '`/m/{user_code}` under an upper-case M, which QR alphanumeric mode encodes.'
      tags: [machines]
      security: []
      parameters:
        - name: user_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: To the approve page.

  /v1/machines/self/keys:
    post:
      operationId: machines_post_self_keys
      summary: A machine rotates its own key
      description: |
        SPEC-095 FR-64. Signed by one of the machine's currently valid
        `machine_api` keys, this adds a new one for that machine alone. The
        body names only the key: the subject is the machine the signature
        authenticated and the purpose is `machine_api`, and a body that names
        anything else is refused. The machine's previous keys stay valid for
        the overlap. Recorded as `machine-self:<uuid>`.

        Mounted only when `[machines] enabled = true`; otherwise 404.
      tags: [machines]
      security:
        - machineSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              additionalProperties: false
              properties:
                public_key:
                  type: string
                  description: The new Ed25519 public key, base64url without padding.
      responses:
        '200':
          description: The new key's kid, and the kids now ending at the overlap.
          content:
            application/json:
              schema:
                type: object
                required: [kid, rotated_out, overlap_secs]
                properties:
                  kid:
                    type: string
                  rotated_out:
                    type: array
                    items:
                      type: string
                  overlap_secs:
                    type: integer
        '400':
          description: A malformed body or key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No machine signature, or one that did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The key is refused (already trusted, or too many valid keys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/kinds/{kind}/{name}:
    get:
      operationId: core_get_resource
      summary: Get a resource
      description: Returns a single resource by kind and name.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: core_delete_resource
      summary: Delete a resource
      description: >
        Deletes a resource by kind and name. The owner's OIDC token, or an
        enrolled machine the grants permit.

        SPEC-116 D-34 / FR-56 (owner decision 2026-09-28): with `[machines]
        owner_devices_may_revoke = true`, a device bearer whose principal is
        the owner may also delete a `Home` (attributed
        `owner-device:<enrollment id>`), so disconnecting a hub from the app
        removes its Home too. Only `Home`: every other kind, and `POST
        /v1/apply`, still refuse a device bearer with 401. A sub-user's device
        is 403 `owner_only` (or `sub_user_forbidden` when chat is enabled).
      tags: [core]
      security:
        - ownerAuth: []
        - enrollmentAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Resource deleted.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A device bearer that is not the owner's, deleting a `Home`; or a
            caller the grants do not permit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/domains:
    get:
      operationId: core_get_domains
      summary: List the verified custom hostnames this operator serves
      description: >
        The alias set the hub has told this operator are its own, with the
        certificate state of each. A `Host` outside this set is answered
        `421 Misdirected Request`. `enabled: false` means custom domains are
        switched off on this operator, which is not the same as a set the hub
        confirmed to be empty.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The alias set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainsView'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/kinds/{kind}/{name}/status:
    get:
      operationId: core_get_resource_status
      summary: Get resource status
      description: |
        Returns the status subresource of a resource: generation, phase,
        conditions, and `status` — the Kind's own status document (for a
        `Function`, `sourceVersion`, `sourceSigner` and the rest). Asks
        `ReadStatus`, so a principal that may only read status (a CI
        machine confirming what it deployed) sees what runs without `Get`.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resource status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceStatus'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ── Endpoints ────────────────────────────────────────────────────────────

  /v1/endpoints/enrollments:
    post:
      operationId: endpoints_post_enrollment
      summary: Enroll an endpoint
      description: |
        Enroll an endpoint with a pairing code, a hub token or the bootstrap
        token. No bearer required.

        An operator is exactly one airdress (its configured `airdress`).
        Before any credential is evaluated — and before dry-run — the
        request's `airdress` is compared with it: a configured alias is
        normalized to the canonical airdress, which is what the enrollment is
        stored under (the delegation must name the canonical airdress), and
        any other airdress is refused with `403 airdress_not_served`. The
        refusal is byte-identical on every path, consumes no pairing code,
        burns no hub `jti`, and does not count against the bootstrap backoff.

        A delegation-only device (SPEC-137 §5.2: the CLI, the editor) sends
        `delegation_only: true` and may send `device_kind`; both are for a
        client-held human device, and the kind recorded is the one its
        delegation signs (`422 device_kind_not_delegated` otherwise). It may
        leave out `airdress_root_public_key`, which it never held: its
        delegation is verified against the pinned root, and with no pin the
        enrollment is refused `409 root_key_not_pinned`.
      tags: [endpoints]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Enrollment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid pairing token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            `airdress_not_served` — the request names an airdress this
            operator is not.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: Already enrolled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: endpoints_get_enrollments
      summary: List enrollments
      description: |
        Returns the active (non-revoked) endpoint enrollments the caller's
        scope covers (SPEC-049 R1.2), on one airdress. The owner's ZITADEL
        bearer sees every enrollment on the operator's configured `airdress`
        (an operator is one airdress; its display `name` is never read as
        one). A device sees, within its own airdress, its own principal's
        devices (all of them if that principal is the owner); an unattributed
        device sees itself. Each item carries its `airdress`. Machines are
        refused: they hold no bearer, and this route takes nothing else.

        On the SPEC-042 sub-user allowlist. A sub-user resolves to
        `CallerScope::Principal`, so the response holds that principal's
        own devices and nothing else — `/v1/me` for devices. It is there
        because a redeemed device reads `key_custody` from here to learn
        which chat lane it is on; a device that cannot read it assumes
        `client_held` and routes onto the MLS envelope lane a sub-user is
        forbidden from.
      tags: [endpoints]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: List of enrollments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/endpoints/enrollments/{id}:
    get:
      operationId: endpoints_get_enrollment
      summary: Get an enrollment
      description: |
        Returns a single enrollment by ID. A revoked row within the caller's
        scope is readable here too, carrying `revoked_at` and — when the
        revoker announced one — `revoked_reason`, so a device that was
        closed when `sibling_revoked` went by can still learn a sibling was
        signed out for idleness. The listing stays active rows only.
      tags: [endpoints]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The enrollment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Enrollment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: endpoints_delete_enrollment
      summary: Delete an enrollment
      description: |
        Revokes an endpoint enrollment. A device may revoke within its own
        airdress and scope; the owner's ZITADEL bearer may revoke any
        enrollment on the operator's configured `airdress`, which is the only
        remote way to retire a device that can no longer sign for itself.
      tags: [endpoints]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Enrollment deleted.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Enrollment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/endpoints/root-recovery:
    get:
      operationId: endpoints_get_root_recovery
      summary: Pending root resets on the caller's airdress
      description: |
        The root resets scheduled — asked for, not yet executed or
        cancelled — on the caller's airdress, readable by ANY active
        enrollment on it, including one outside the objector window. That
        is what makes the window safe: a device the graduation count no
        longer waits for can still find out a reset is pending and cancel
        it with `POST /v1/endpoints/root-recovery/{id}/cancel`. A device
        that was closed when the in-app notice was published reads this on
        open.

        A list, not a singleton, though the operator holds at most one
        pending request per airdress. Another airdress's state is an empty
        list, never a 403. On the sub-user allowlist: a sub-user's device
        is one of the devices a reset destroys.

        Mounted, like its sibling cancel and approve routes, only when
        `[recovery] enabled = true`; absent otherwise.
      tags: [endpoints]
      security:
        - enrollmentAuth: []
      responses:
        '200':
          description: The pending requests, possibly none.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingRootRecovery'
        '401':
          description: Not an active enrollment bearer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/endpoints/root-recovery/{id}:
    get:
      operationId: endpoints_get_root_recovery_request
      summary: Read a root reset request (the asker's return channel)
      description: |
        The device that asked for a reset holds no credential — that is why
        it asked — and until this route existed it could learn its request
        executed only by probing the public root pin. Unauthenticated; the
        request id is the capability, the same model as
        `GET /v1/endpoints/device-join-requests/{id}`. Rate-limited per IP
        with the other unauthenticated reads.

        Answers `state`, `scheduled_for` and, once executed, `executed_at`
        — and nothing else. Never the requester's account subject, the
        assertion, the address it was asked from, the objector ids or the
        approval tally. An unknown id is a 404 indistinguishable from
        anyone else's. Mounted only when `[recovery] enabled = true`.
      tags: [endpoints]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootRecoveryRequestStatus'
        '404':
          description: Unknown id.
        '429':
          description: '`too_many_requests` — the per-IP read budget.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/device-join-requests:
    post:
      operationId: endpoints_post_device_join_request
      summary: Ask to join an airdress from a new device
      description: |
        A device signing in with the hub on an airdress that already has a
        device leaves a **join request** instead of hitting a dead end. Every
        enrolled device is told (`device_join_requested` on the client event
        stream, carrying the label, the id and the deadline), and one of them
        approves or declines. Approval is the existing root-transfer
        ceremony driven backwards against `public_key`; the account never
        admits a device, only a device holding the root does.

        Unauthenticated in the bearer sense: the caller holds no credential
        here yet. `hub_token` is the SPEC-034 hub enrollment token
        (`purpose: enrollment`), validated exactly as the hub-token
        enrollment path validates it — issuer, audience, airdress, single-use
        `jti`. A fresh token per call: validation burns the `jti`. Mounted
        only when `enrollment.hub_issuer` is configured.

        Every token failure is one byte-identical `401 assertion_rejected`,
        counted against the per-IP backoff; a foreign `sub` is `403
        airdress_not_served` before anything is validated. A request lives
        `enrollment.join_window` (ten minutes unless set). One live request
        per `(airdress, public_key)`; at most four pending per airdress.
        Nothing here is minted — no code, no token, no enrollment. A
        refused caller learns nothing about whether the airdress has
        devices; an ACCEPTED caller, who holds a valid hub assertion for
        this airdress, is told `state: unanswerable` when it has no active
        human enrollment — nothing a reset would not tell the same caller,
        since with zero devices the reset executes immediately. Only zero
        rows are unanswerable: devices outside the reset's objector window
        can still approve, so their request stays `pending`.
      tags: [endpoints]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceJoinRequestBody'
      responses:
        '201':
          description: The request is open; read it by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceJoinRequestCreated'
        '401':
          description: '`assertion_rejected` — every token failure, uniformly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`airdress_not_served` — the token names another airdress.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `join_request_pending` — this public key already has a live
            request; the body carries its `request_id` and `expires_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `invalid_public_key`, `invalid_device_label`,
            `invalid_device_class`, `invalid_device_kind`,
            `invalid_device_public_key`, `invalid_device_id` or
            `delegation_fields_without_delegation_only`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            `join_request_limit` — four requests already wait on this
            airdress — or `too_many_requests` from the per-IP backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: endpoints_get_device_join_requests
      summary: Open join requests on the caller's airdress
      description: |
        What a device that was closed when the notice was published reads
        on open. Readable by ANY active enrollment on the airdress:
        requiring the owner principal would exclude the second device, which
        is the device best placed to decide. On the sub-user allowlist —
        seeing that somebody is asking is not privileged; deciding is not
        granted to a sub-user's device, which holds no root to seal with.

        Each entry is the label, the asking device's public key and two
        timestamps. Deliberately absent: the requester's account subject,
        the `jti`, and the address it asked from.
      tags: [endpoints]
      security:
        - enrollmentAuth: []
      responses:
        '200':
          description: The open requests, possibly none.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingDeviceJoinRequest'
        '401':
          description: Not an active enrollment bearer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/endpoints/device-join-requests/{id}:
    get:
      operationId: endpoints_get_device_join_request
      summary: Read a join request (the return channel)
      description: |
        Unauthenticated; the request id is the capability — the same model
        `GET /v1/endpoints/root-transfers/{id}` already uses, deliberately.
        Rate-limited per IP with the other unauthenticated reads.

        Answers the state and, once approved, `slot_id` and
        `sender_public_key` — exactly what the asking device needs to
        collect the sealed seed from the transfer slot and unseal it. It
        then enrolls with a fresh hub token. Also `device_label` and
        `requested_at`: the asker's own words, so a sheet opened from a
        scanned code fills itself in without the authenticated list the
        asker cannot read. Never the account, the address, or which device
        decided. Reading does not consume anything; the single-collect
        property lives on the transfer slot. A leaked id buys a slot id, a
        public key and a label the holder typed — one ceremony burned —
        never a credential.
      tags: [endpoints]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request's state, with the slot once approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceJoinRequestStatus'
        '404':
          description: Unknown id.
        '429':
          description: '`too_many_requests` — the per-IP read budget.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/device-join-requests/{id}/approve:
    post:
      operationId: endpoints_post_device_join_request_approve
      summary: Approve a join request with the slot the root was sealed into
      description: |
        The LAST step of the ceremony, not the first. By now the approving
        device has minted a root-transfer slot (`POST
        /v1/endpoints/root-transfers`), sealed the root seed to the request's
        `public_key` with the existing envelope, and deposited the blob. This
        records which slot and the approver's ephemeral key, so the asking
        device can find and unseal it, and publishes `device_join_approved`
        so the other devices' prompts clear.

        Any active enrollment on the airdress may approve. NOT on the
        sub-user allowlist: admitting a device is an owner act, and a
        sub-user's device holds no root to seal with. `slot_id` must name a
        live slot on this airdress, checked before anything is written.
      tags: [endpoints]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: A phone's request — the root-transfer answer.
                  required: [slot_id, sender_public_key]
                  properties:
                    approval:
                      type: string
                      enum: [root_transfer]
                    slot_id:
                      type: string
                      format: uuid
                      description: The root-transfer slot the sealed seed is in.
                    sender_public_key:
                      type: string
                      description: |
                        The approving device's ephemeral X25519 public key for
                        this ceremony, base64url without padding, 32 bytes.
                - type: object
                  description: |
                    A delegation-only request (SPEC-137 §5.2) — a root-signed
                    delegation naming the request's `device_public_key`,
                    `device_id` and `device_kind`, verified against the
                    pinned root before it is recorded. No slot, no seal.
                  required: [approval, delegation]
                  properties:
                    approval:
                      type: string
                      enum: [delegation]
                    delegation:
                      type: object
                      additionalProperties: true
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, state]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum: [approved]
        '401':
          description: Not an active enrollment bearer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such request on the caller's airdress.
        '409':
          description: |
            `join_request_not_pending` — already decided or expired;
            `join_request_approval_mismatch` — a root transfer for a
            delegation-only request, or a delegation for a phone's;
            `root_key_not_pinned`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`invalid_public_key`, `unknown_slot`, `invalid_approval` or `invalid_delegation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/device-join-requests/{id}/decline:
    post:
      operationId: endpoints_post_device_join_request_decline
      summary: Decline a join request
      description: |
        Any active enrollment on the airdress. The asking device's next read
        says `declined`; `device_join_declined` clears the prompt on the
        other devices. Declining locks nobody out — the person may ask
        again. Off the sub-user allowlist with `approve`.
      tags: [endpoints]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, state]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum: [declined]
        '401':
          description: Not an active enrollment bearer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such request on the caller's airdress.
        '409':
          description: '`join_request_not_pending` — already decided or expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/device-join-requests/{id}/withdraw:
    post:
      operationId: endpoints_post_device_join_request_withdraw
      summary: Withdraw a join request (the asking device)
      description: |
        The asking device takes its request back: it left the wait screen
        for a reset, went back, or was killed and is cleaning up on its next
        open. Unauthenticated with the id as the capability, exactly as
        `GET /{id}` is, and rate-limited with it. A pending or unanswerable
        request becomes `withdrawn`; the other devices' prompts clear with
        `device_join_declined {reason: "withdrawn"}`. Idempotent: a
        withdrawn request answers 200 again. Nothing already decided or
        expired is un-decided.

        A root reset on the airdress expires every open request on it
        without this call (`device_join_declined {reason: "reset"}`), so a
        device that reset is never shown its own abandoned request.
      tags: [endpoints]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, state]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum: [withdrawn]
        '404':
          description: Unknown id.
        '409':
          description: '`join_request_not_pending` — already decided or expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`too_many_requests` — the per-IP read budget.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/member-authorization:
    get:
      operationId: endpoints_get_member_authorization
      summary: A member signs in here for the hub's authorization server
      description: |
        Where the hub's authorization server sends somebody who asked for a
        token for this operator without owning its airdress. `request` is a
        JWT the hub signed with its authorization server's key (`typ:
        oauth-authz-req+jwt`), verified against the keys the hub's RFC 8414
        metadata names: `iss` the configured `[auth] hub_issuer`, `aud` this
        operator's origin, at most five minutes long, `return_uri` exactly
        the hub's `/oauth/member/callback`, `resource` this operator's
        `/v1` or `/v1/mcp`, a nonce, and a `jti` never seen before.

        A valid request redirects to this operator's principal login
        (authorization code with PKCE, `[auth] member_client_id`). Every
        refusal is the same plain-text sentence. Rate-limited per source
        network. Needs `[auth] member_client_id`, `[auth] hub_issuer` and
        `[identity] publish_keys`; otherwise 404.
      tags: [endpoints]
      security: []
      parameters:
        - name: request
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: "To the principal login's authorization endpoint."
        '400':
          description: "A request this operator does not accept (forged, foreign, expired or replayed)."
        '404':
          description: "Member sign-in is not configured."
        '429':
          description: "Too many sign-ins from this network; `Retry-After: 60`."

  /v1/endpoints/member-authorization/callback:
    get:
      operationId: endpoints_get_member_authorization_callback
      summary: The principal login's redirect back, then the assertion to the hub
      description: |
        Exchanges the code with the PKCE verifier and resolves the account
        to an active human sub-user bound by OIDC. That sub-user gets a
        principal assertion (`typ: principal-assertion+jwt`, `iss` this
        origin, `aud` the hub issuer, `sub` the principal id, `role:
        sub_user`, the hub's nonce, two minutes), signed with this
        operator's `principal_assertion` key from
        `/.well-known/airdress/keys.json`, and the browser goes back to the
        hub's callback with it and the hub's `state`. The owner and anyone
        who is not a sub-user get the same refusal.
      tags: [endpoints]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: "To `<hub issuer>/oauth/member/callback?assertion=…&state=…`."
        '400':
          description: "A missing, expired or replayed state, or a refused code exchange."
        '403':
          description: "The account is no sub-user of this airdress."
        '404':
          description: "Member sign-in is not configured."
        '429':
          description: "Too many sign-ins from this network; `Retry-After: 60`."

  /v1/endpoints/pairing-codes:
    post:
      operationId: endpoints_post_pairing_code
      summary: Create a pairing code
      description: |
        Mints a short-lived pairing code for bootstrapping a new endpoint.
        The code names the caller's airdress: a device's own, or — for the
        owner's ZITADEL bearer — the operator's configured `airdress`, so an
        owner-minted code redeems on it.

        `principal_id` — a code that enrolls the redeeming device as a
        named principal — is accepted from the owner's ZITADEL bearer and
        from a device whose scope is the whole airdress (an owner-paired
        device carrying the owner principal). A sub-user's device, or a
        device with no principal, is refused with `403
        pairing_code_escalation`. No hub-issued token reaches this route.
      tags: [endpoints]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
      responses:
        '201':
          description: Pairing code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeResponse'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            `pairing_code_escalation` — the caller asked for more than it
            holds: a role or custody its own enrollment does not carry, or
            a `principal_id` when it is not the airdress owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `unknown_principal` — `principal_id` names no active principal
            on this operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/endpoints/{enrollment_id}/push-subscription:
    put:
      operationId: endpoints_put_push_subscription
      summary: Register or replace a push subscription
      description: |
        SPEC-008 — registers the RFC 8030 endpoint and RFC 8291 key
        material a device wants background notifications delivered to.
        Idempotent by replacement, so a distributor that reissues an
        endpoint overwrites in place and the device keeps its session.
        Replacing clears the failure count and any disabled reason.

        The bearer must be the enrollment named in the path. Naming
        another enrollment returns 403, not 404 — the caller sent the id,
        so concealing its existence discloses nothing and only makes a
        permission error look like a typo.

        The endpoint URL is rejected unless it is `https://` and outside
        loopback, link-local and private ranges. A self-hoster pointing at
        an ntfy on the same LAN opts in via `push.allow_private_endpoints`.
      tags: [endpoints]
      security:
        - ownerAuth: []
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRegistration'
      responses:
        '200':
          description: Subscription stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionStatus'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The bearer does not own the enrollment in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The enrollment no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Endpoint refused, or key material of the wrong size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: endpoints_get_push_subscription
      summary: Read push subscription status
      description: |
        SPEC-008 — reports whether push is set up for this device and how
        it is faring. Returns the endpoint's **host only**, never the full
        URL: the endpoint is a bearer capability to notify the device and
        is in the same trust class as a session token. It goes in and it
        never comes back out.

        Absence is a normal answer (`present: false`), not a 404.
      tags: [endpoints]
      security:
        - ownerAuth: []
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionStatus'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The bearer does not own the enrollment in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: endpoints_delete_push_subscription
      summary: Delete a push subscription
      description: |
        SPEC-008 — the device opts out of background delivery and keeps
        working over SSE alone. Idempotent: deleting a subscription that
        is already gone is success, because what the caller wanted is a
        device without one.
      tags: [endpoints]
      security:
        - ownerAuth: []
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subscription deleted, or there was none.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The bearer does not own the enrollment in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Federation ───────────────────────────────────────────────────────────

  /v1/federation/inbox/{airdress}:
