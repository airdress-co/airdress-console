  # ── Chat ─────────────────────────────────────────────────────────────────

  /v1/chat/conversations:
    post:
      operationId: chat_post_conversation
      summary: Create a conversation
      description: Creates a new chat conversation with a target airdress.
      tags: [chat]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_airdress]
              properties:
                target_airdress:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: chat_get_conversations
      summary: List conversations
      description: |
        Returns a paginated list of conversations ordered by most-recently-updated.
        When the `airdress` query parameter is supplied, the list is scoped to
        conversations with that peer. When omitted, all conversations on this
        operator are returned — the "inbox" view.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: airdress
          in: query
          required: false
          description: Optional peer airdress to filter by. When omitted, all conversations are returned.
          schema:
            type: string
        - name: include_hidden
          in: query
          required: false
          description: |
            Include conversations the caller hid (`hidden_at` set). Default
            false: hidden conversations are left out of the list.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/self:
    post:
      operationId: chat_post_self_conversation
      summary: Get or create the self-conversation
      description: |
        The caller's single, permanent conversation with themselves.
        Idempotent: returns the existing conversation with 200, or creates
        it and returns 201 the first time. Never produces a second row.
      tags: [chat]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The existing self-conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: Self-conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/principal:
    post:
      operationId: chat_post_principal_conversation
      summary: Open a thread between two principals of this operator
      description: |
        SPEC-070. Creates the *pair* of conversation rows that make up a
        principal-to-principal thread: one owned by each side, sharing a
        `thread_id`, each encrypted at rest under that principal's own
        per-principal key. Returns the left-hand side's conversation.

        `principal_id` names the left-hand side and defaults to the caller.
        Naming a different principal is what lets the owner open a thread
        between two of their sub-users, of which the owner is not a member.

        Owner-only. A sub-user bearer is refused with
        `403 sub_user_forbidden`, enforced by this route's absence from the
        default-deny sub-user allowlist rather than by a role check in the
        handler: a sub-user free to name any peer principal id holds an
        invite-as-someone-else primitive and a principal-id oracle. Using a
        thread once it exists stays open to sub-users; only starting one is
        withheld.

        Idempotent per contact (SPEC-053): a second call for the same pair
        returns the existing thread with 200.

        Messages on such a thread travel the operator-held plaintext lane
        even from a `client_held` device — every sub-user shares the owner's
        airdress, so the thread has no MLS form available to it. Clients
        learn this from `features.principal_lane_operator_held` on
        `GET /v1/chat/clients/config`.
      tags: [chat]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_principal_id]
              properties:
                principal_id:
                  type: string
                  format: uuid
                  description: Left-hand side of the pair. Defaults to the caller.
                peer_principal_id:
                  type: string
                  format: uuid
                  description: The other principal.
                title:
                  type: string
                  description: |
                    Applied to both rows. When omitted, each row is titled
                    with the counterparty's display name.
      responses:
        '200':
          description: The pair already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: Pair created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: |
            `invalid_peer` — the two principal ids are equal. That thread is
            `POST /v1/chat/conversations/self`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sub-user. Creating a pair is owner-only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: One of the principals does not exist or is revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/agent/{agent_id}:
    post:
      operationId: chat_post_agent_conversation
      summary: Start a new thread with an agent
      description: |
        Opens a new conversation with the named agent (`operator` is the
        only agent today). Whether a *new* thread is possible is decided by
        the inference pool: when every pool member declares
        `traits.supportsMultiConversation` (the default), each call creates
        a distinct conversation and returns 201. When any member declares
        it `false`, the call returns the caller's existing agent conversation
        with 200 instead. Query `GET /v1/chat/agents/{agent_id}` to know
        beforehand.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTitledConversationRequest'
      responses:
        '201':
          description: New thread created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '200':
          description: The agent does not support multiple threads; the existing conversation is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown agent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/airdress/{target_airdress}:
    post:
      operationId: chat_post_airdress_conversation
      summary: Start an additional thread with an airdress
      description: |
        Always creates a new conversation with `target_airdress`, even when
        one exists. Contrast `POST /v1/chat/conversations`, which returns the
        caller's existing conversation with that airdress if there is one.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: target_airdress
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTitledConversationRequest'
      responses:
        '201':
          description: New thread created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/agents/{agent_id}:
    get:
      operationId: chat_get_agent
      summary: Describe an agent
      description: |
        What a client may expect from an agent before acting. Read live
        from the inference pool on every call.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDescriptor'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown agent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}:
    get:
      operationId: chat_get_conversation
      summary: Get a conversation
      description: Returns a single conversation by ID.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: chat_patch_conversation
      summary: Update a conversation
      description: |
        Updates mutable fields of a conversation: the title and the hidden flag.

        `hidden: true` hides the conversation from the default list (an
        existing `hidden_at` is kept); `hidden: false` shows it again. A body
        that carries `hidden` and no `title` changes only the hidden flag — the
        title is kept and `updated_at` does not move, so neither does the list
        order. A body without `hidden` behaves as it always has: a missing
        `title` clears it and `updated_at` is bumped.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                hidden:
                  type: boolean
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: chat_delete_conversation
      summary: Delete a conversation
      description: |
        Deletes the caller's one-to-one conversation with another airdress,
        and everything the operator holds for it: its messages and every
        envelope buffered for it. Every device of the caller hears
        `conversation_deleted` on `GET /v1/chat/envelopes/events` and drops
        the conversation, its messages and its MLS group state.

        The other side is not told. Its next message opens a fresh message
        request: deleting is not declining, and blocking stays the way to
        keep a sender out.

        Allowed from any device of the conversation's own person, sub-users
        included. Refused for an agent device (`403 agent_device`), for any
        lane other than an airdress conversation (`409 not_deletable`: the
        self, agent, household, group and surface lanes), and for a declined
        request (`409 declined`, whose row is what keeps the sender out).
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: An agent device does not delete a person's conversation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Conversation not found, or not the caller's.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not deletable this way (`not_deletable`), or a declined request (`declined`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/messages:
    post:
      operationId: chat_post_message
      summary: Post a message
      description: Appends a message to a conversation.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, blocks]
              properties:
                role:
                  type: string
                blocks:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: chat_get_messages
      summary: Get messages
      description: Returns messages in a conversation, optionally after a sequence number.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: include_ciphertext
          in: query
          required: false
          description: |
            SPEC-035 debug knob. When `true`, each returned message
            also carries `content_mode`, `blocks_ciphertext` (base64),
            and `blocks_nonce` (base64) — the raw on-disk envelope
            as it sits in the messages table. Default false; response
            shape stays identical to pre-SPEC-035 clients.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/events:
    get:
      operationId: chat_get_conversation_events
      summary: Conversation event stream
      description: SSE stream of real-time events for a conversation.
      tags: [chat]
      x-sse: true
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/mls/members/{device_id}/revocation:
    get:
      operationId: mls_get_member_revocation
      summary: Whether an MLS member device is revoked
      description: >-
        Check 5 of MLS leaf verification (airdress-mls v0.3.0 fails closed
        without it). Any enrolled device of this airdress may ask: the
        owner's devices about any member, a sub-user's devices about their
        own principal's devices only. A caller with no credential (a peer
        airdress's client verifying one of this airdress's leaves) is
        answered about this airdress's own devices only, rate-limited per
        source IP; an unknown id and another airdress's id answer the same
        404. This operator's own agent member always answers live. A 404, a
        429 or a 503 means refuse the leaf. A live answer carries
        `Cache-Control: max-age=60`; every other answer is `no-store`.
      tags: [chat]
      security:
        - ownerAuth: []
        - {}
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{1,64}$'
      responses:
        '200':
          description: The member's revocation state.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, revoked, kind]
                properties:
                  device_id:
                    type: string
                  revoked:
                    type: boolean
                  revoked_at:
                    type: string
                    format: date-time
                  kind:
                    type: string
                    enum: [device, agent_device, operator_agent]
        '401':
          description: A bearer was sent and is not an enrolled device's.
        '404':
          description: member_not_found — unknown, or not the caller's to ask about. Refuse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: too_many_requests — a caller with no credential exceeded its per-IP budget. Refuse and ask later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: revocation_unavailable — the state could not be read. Refuse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/cancel:
    post:
      operationId: chat_post_cancel
      summary: Cancel conversation processing
      description: Cancels any in-progress generation for a conversation.
      tags: [chat]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation accepted.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/ptt/key:
    post:
      operationId: chat_ptt_key
      summary: Key the microphone (SPEC-069)
      description: |
        Requests the push-to-talk floor for this conversation. Radio
        semantics: at most one station transmits at a time, contention is
        refused rather than queued, and strictly higher priority preempts.

        Mounted only when `chat.ptt_enabled`. A client discovers that from
        `features.ptt_enabled` on `GET /v1/chat/clients/config` — probing
        this route cannot tell a disabled feature from a routing fault,
        because an unmounted path falls through to a 200 HTML page.

        Re-keying by the station that already holds the floor is
        idempotent and returns the same transmission, so a client whose
        grant response was lost may retry without splitting one utterance
        into two.
      tags: [chat]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: string
                  enum: [routine, priority, emergency]
                  default: routine
      responses:
        '200':
          description: |
            The floor is yours. `preempted` is present only when this grant
            took the floor from another transmission.
          content:
            application/json:
              schema:
                type: object
                required: [transmission_id]
                properties:
                  transmission_id:
                    type: string
                    format: uuid
                  preempted:
                    type: string
                    format: uuid
        '409':
          description: |
            Refused. `busy` means someone holds the floor at equal or
            higher priority; the request is answered now and never queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  denied:
                    type: string
                    enum: [busy, not_monitoring]
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/ptt/renew:
    post:
      operationId: chat_ptt_renew
      summary: Renew the transmission lease (SPEC-069)
      description: |
        The 1 Hz keepalive that holds the floor, and the channel through
        which preemption is learned. At Tier 1 there is no audio until the
        key is released, so nothing else would renew the one-second lease
        and every transmission would be reclaimed as a stuck mic.

        A `409 { "lost": true }` means the floor is no longer yours —
        preempted, or timed out. Stop recording and tell the user; do not
        retry, because the floor is held by someone else.
      tags: [chat]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PttTransmission'
      responses:
        '200':
          description: Still yours.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: The floor is no longer yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lost:
                    type: boolean
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/chat/conversations/{id}/ptt/release:
    post:
      operationId: chat_ptt_release
      summary: Un-key — "over" (SPEC-069)
      description: |
        Ends the transmission normally. `204` whether or not the floor was
        still held: releasing one you have already lost happens on every
        preemption, between the last keepalive and the button coming up,
        and is not a fault a client can act on.

        Monitors are told over the envelope SSE stream, as `ptt_ended` —
        never as `ptt_lost`, which means the talker went silent without
        saying so.
      tags: [chat]
      security:
        - enrollmentAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PttTransmission'
      responses:
        '204':
          description: Un-keyed.
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/functions/sources:
    post:
      operationId: functions_source_publish
      summary: Publish a function's source tree (SPEC-112)
      description: |
        Stores a signed TypeScript/JavaScript tree as an immutable,
        content-addressed version and returns its digest. `apply` a
        `Function` manifest naming `spec.source.version` to run it; this
        route never changes what runs and can never write
        `spec.capabilities` (a grant changes only by applying the manifest).

        Three encodings: `application/zstd` (the archive as the body; the
        function in `x-airdress-function`, the signature in
        `x-airdress-signature`, the signer in `x-airdress-signer` or
        `x-airdress-signer-machine`, the base in `x-airdress-based-on`);
        `multipart/form-data` (parts `archive`, `name`, `signature`,
        `signer`, `signerRef`, `basedOn`); or `application/json` (a file
        map, converted to the archive server-side).

        A function that already serves a version must name it in `basedOn`;
        a stale base is `409 source_base_stale`, never merged. A function
        served from an import is `409 source_managed_externally`. A
        byte-identical tree returns the existing version with `200` and
        stores nothing. `?dry-run=true` runs every check and stores nothing.

        Asks `Publish` on the function, which `Apply` implies: the owner, or
        a principal (a CI machine) granted `Publish`.

        A dry run carrying no signature is checked without verification
        (an editor checks on save before anyone signs); every answer
        carries `sourceDigest`, the canonical file-set digest a signature
        is made over (Ed25519 over its 32 raw bytes).
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: dry-run
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcePublishJson'
          application/zstd:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  format: binary
                name:
                  type: string
                signature:
                  type: string
                signer:
                  type: string
                signerRef:
                  type: string
                basedOn:
                  type: string
      responses:
        '200':
          description: The identical tree was already stored, or a dry run passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePublished'
        '201':
          description: A new version was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePublished'
        '403':
          description: Not permitted to apply this function.
        '409':
          description: A stale base (`source_base_stale`), or a function served from an import (`source_managed_externally`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConflict'
        '415':
          description: Not one of the three encodings.
        '422':
          description: A refusal, with path, line and column as fields and every ungranted capability named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceError'

  /v1/functions/sources/{version}:
    get:
      operationId: functions_source_get
      summary: A published version's manifest, file index and metadata (SPEC-112)
      description: |
        The owner, or a principal granted `ReadSource` on the function the
        version was published for. A principal with only `ReadStatus` is
        refused with 403. `engineDigest` is opaque.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceVersion'
        '403':
          description: No `ReadSource` grant.
        '404':
          description: No such version.

  /v1/functions/sources/{version}/files/{path}:
    get:
      operationId: functions_source_file
      summary: One file of a published version (SPEC-112)
      description: |
        One file's bytes, with its own content type (never an executable
        one). One file per request. Same authorization as reading the
        version.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: The archive path, e.g. `src/lib/sign.ts`.
          schema:
            type: string
      responses:
        '200':
          description: The file.
        '403':
          description: No `ReadSource` grant.
        '404':
          description: No such version or file.

  /v1/functions/{name}/promote:
    post:
      operationId: functions_source_promote
      summary: Run another published version of a source function, and change nothing else (SPEC-113)
      description: |
        Sets `spec.source.version` to a version already published for this
        function and changes nothing else in the manifest — not the grant,
        not the config, not the limits — through the resource plane's normal
        write, so a new generation, history and reconcile follow as for an
        apply. Asks `Promote` on the function (implied by `Apply`), which a
        CI principal can hold without `Apply` (apply replaces the whole manifest and so can widen
        the grant). Refused: a stale `basedOn` (409 `source_base_stale`, both
        versions named); a function served from an import (409
        `source_managed_externally`); a bundle function (409
        `not_a_source_function`); an unknown version (404
        `source_version_not_found`); a version not signed by the manifest's
        signer (422 `source_signer_mismatch`) or by a compromised key (422
        `source_signer_compromised`); a version built on another engine (422
        `engine_unavailable`); a version asking for more than the
        applied grant (422 `capability_not_granted`, every denial named).
        Promoting the version already running answers 200 with
        `changed: false`.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                basedOn:
                  type: string
                  description: The version the caller believes runs now.
      responses:
        '200':
          description: Promoted (or already running).
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  previous:
                    type: string
                    nullable: true
                  generation:
                    type: integer
                  changed:
                    type: boolean
        '403':
          description: Not permitted to promote this function.
        '404':
          description: No such Function, or no such version published for it.
        '409':
          description: A stale base, an imported function, or a bundle function.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConflict'
        '422':
          description: A signer mismatch, a compromised signer, or a version the grant does not cover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceError'

  /v1/functions/{name}/versions:
    get:
      operationId: functions_source_history
      summary: What a function served, and the versions stored for it (SPEC-112)
      description: |
        The deployment history, newest first, with the current version
        marked — the view that makes rollback (apply an earlier
        `spec.source.version`) usable. `ReadStatus` on the function.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHistory'
        '403':
          description: No `ReadStatus` grant.

  /v1/functions/{name}/logs:
    get:
      operationId: functions_source_logs
      summary: A function's durable log, newest first (SPEC-112)
      description: |
        Invocation records and the function's own log lines, retained for
        `functions.source.logs.retention_days` (default seven) and capped
        per function; nothing older exists anywhere, because nothing ships
        the log off the box. Both tiers write here. `ReadStatus` on the
        function. Each row carries an `id`; `after=<id>` returns only the
        rows after it, oldest first, which is how a follower polls.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: invocation
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionLogPage'
        '403':
          description: No `ReadStatus` grant.

  /v1/schemas:
    get:
      operationId: schemas_list
      summary: Every schema this operator serves, with a version and an ETag (SPEC-112)
      description: |
        One per registered Kind, plus `function-source-manifest` and
        `function-template`. Generated
        from the same types as the published schemas, from this binary. Any
        authenticated principal.
      tags: [core]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object

  /v1/schemas/{name}:
    get:
      operationId: schemas_get
      summary: One JSON Schema, with an ETag (SPEC-112)
      description: |
        A Kind name (e.g. `Function`), `function-source-manifest` or
        `function-template`.
        Revalidate with `If-None-Match`; a client caches per operator
        version instead of shipping a copy.
      tags: [core]
      security:
        - ownerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema:
                type: object
        '304':
          description: Unchanged since the ETag sent.
        '404':
          description: No such schema; the body lists the available ones.

  /v1/functions/templates:
    get:
      operationId: functions_templates_list
      summary: The function template catalogue (SPEC-112)
      description: |
        What "new function" starts from, served as data so an editor, the
        CLI and a CI job scaffold from the same answer. Each entry is a
        `template.json` (schema `function-template` under `/v1/schemas`):
        id, title, description, entry file, the grants it needs
        (`requires`) and the form over its configuration (`config.fields`,
        one `spec.config` entry per field). Any authenticated principal;
        mounted when the source tier is enabled.
      tags: [functions]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: '`{ "templates": [ … ] }`, smallest first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/FunctionTemplate'

  /v1/functions/templates/{id}:
    get:
      operationId: functions_templates_get
      summary: One template, with its files (SPEC-112)
      description: |
        The `template.json` fields plus `files`, a map from archive path
        (`function.json`, `src/…`) to text. `?functionId=` writes the
        author's id into the served `function.json` in place of the
        placeholder `example.function`. Packed and signed as they are,
        they are a source tree the operator admits; a function made from
        them no longer refers to the template.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: functionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The template and its files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionTemplateWithFiles'
        '404':
          description: No such template; the body lists the available ones.

  /v1/functions/sdk:
    get:
      operationId: functions_sdk_list
      summary: The Functions SDK catalogue — every library version this operator carries (SPEC-114)
      description: |
        `@airdress/functions`, the library a source function imports by
        `@airdress/functions/<module>` and pins by exact version in
        `function.json` (`"sdk": "1.0.0"`). Per version: its digest (part of
        every pinned function's version), its status (`current`,
        `deprecated` with a `replacement`, or `withdrawn` with a `reason`),
        the host it needs, and its modules with the host worlds each needs,
        its bytes and its bundled size; `stability: alpha` and `testOnly`
        where they apply. `newest` is what a new function pins. Any
        authenticated principal; mounted when the source tier is enabled.
      tags: [functions]
      security:
        - ownerAuth: []
      responses:
        '200':
          description: '`{ "prefix", "newest", "versions": [ … ] }`, oldest first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefix:
                    type: string
                  newest:
                    type: string
                    nullable: true
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SdkRelease'

  /v1/functions/sdk/{version}:
    get:
      operationId: functions_sdk_get
      summary: One Functions SDK version, with its files and types (SPEC-114)
      description: |
        The catalogue entry plus `files`: every module's source and
        `sdk.d.ts`, which declares every module and the `airdress` global.
        Where an editor and the CLI get the library's types and a local
        copy for tests — never from npm.
      tags: [functions]
      security:
        - ownerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The release and its files.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkRelease'
                  - type: object
                    properties:
                      files:
                        type: object
                        additionalProperties:
                          type: string
        '404':
          description: This operator does not carry that version; the body lists the ones it does.

  /v1/tools/mcp:
    post:
      operationId: functions_tools_mcp
      summary: The tool bridge — call functions declared with spec.tool (SPEC-112)
      description: |
        JSON-RPC 2.0 over HTTP (the Model Context Protocol's streamable
        HTTP transport, protocol revision 2025-06-18): `initialize`,
        `ping`, `tools/list`, `tools/call`. A call is the same `/fn/{name}`
        invocation any caller makes, sent with the caller's credential and
        authorized by `Apply` on the function. A retried call (same
        principal, tool, arguments and request id, inside
        `functions.tools.dedupe_window_secs`) is answered from the first
        result; `idempotentHint` is shown and relied on by nothing.

        Mounted only with `[functions.tools] enabled = true`; a function is
        listed only when its manifest sets `spec.tool.enabled`.
      tags: [functions]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                id: {}
                method:
                  type: string
                params:
                  type: object
      responses:
        '200':
          description: A JSON-RPC response — a result, or an error for a malformed call or an unknown tool.
        '202':
          description: A notification was accepted.
        '401':
          description: No credential.

  /v1/mcp:
    post:
      operationId: functions_remote_mcp_post
      summary: Remote MCP — one JSON-RPC message (Streamable HTTP)
      description: |
        The Model Context Protocol's Streamable HTTP transport, revisions
        `2025-11-25` and `2025-06-18`. `initialize` opens a session and
        returns its id in `Mcp-Session-Id`; every later message carries it
        (and `MCP-Protocol-Version`). One message per request — no batches.
        The tools are the local `airdress mcp serve` catalogue minus what
        only the person's own machine can do (sign-in, the hub's airdress
        list, deploy and validate from a directory, the agent device and the
        end-to-end chat lanes), plus the airdress's own tools as `fn_<tool>`.

        Always mounted. While `[mcp] remote_enabled` is off every request
        answers `403 not_enabled` (with `manage_url`, the hub's page) and
        every session ends.

        Only a hub access token (`typ: at+jwt`) whose `aud` is exactly
        `https://<fqdn>/v1/mcp` is accepted — not this operator's `/v1`
        token, not another operator's, not a legacy bearer whatever
        `[auth] accept_legacy_bearer` says. `mcp.read` reads, `mcp.write`
        writes. The token is never forwarded: tools call this operator's
        routes in process for the person it names.
      tags: [functions]
      security:
        - hubAccessToken: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema: {type: string}
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc]
              properties:
                jsonrpc: {type: string}
                id: {}
                method: {type: string}
                params: {type: object}
      responses:
        '200':
          description: A JSON-RPC response. `initialize` carries `Mcp-Session-Id`.
        '202':
          description: A notification or a response was accepted.
        '400':
          description: No session id, or an unsupported `MCP-Protocol-Version`.
        '401':
          description: |
            No token, or one that is not for this resource. Carries
            `WWW-Authenticate: Bearer resource_metadata="https://<fqdn>/.well-known/oauth-protected-resource/v1/mcp", scope="mcp.read mcp.write"`.
        '403':
          description: |
            `not_enabled` (remote MCP is off), `insufficient_scope` (with a
            `WWW-Authenticate` naming the scope to step up to), or
            `not_a_principal`.
        '404':
          description: The session does not exist, ended, or is not this caller's; initialize again.
    get:
      operationId: functions_remote_mcp_stream
      summary: Remote MCP — the session's event stream
      description: |
        `text/event-stream` for the session in `Mcp-Session-Id`. It ends when
        the session does: deleted, idle for an hour, its hub grant revoked
        (within one revoked-grant feed poll), or remote MCP switched off.
      tags: [functions]
      security:
        - hubAccessToken: []
      responses:
        '200':
          description: The stream.
        '401':
          description: As for POST.
        '404':
          description: No such session.
        '406':
          description: The request does not accept `text/event-stream`.
    delete:
      operationId: functions_remote_mcp_delete
      summary: Remote MCP — end the session
      description: |
        Ends the session in `Mcp-Session-Id`, and any event stream it holds.
        Only the principal and grant that opened it may end it.
      tags: [functions]
      security:
        - hubAccessToken: []
      responses:
        '204':
          description: Ended.
        '404':
          description: No such session.

  /.well-known/oauth-protected-resource:
    get:
      operationId: functions_remote_mcp_resource_metadata
      summary: RFC 9728 protected-resource document (remote MCP)
      description: |
        `{resource: "https://<fqdn>/v1/mcp", authorization_servers: [<hub>],
        scopes_supported: ["mcp.read", "mcp.write"],
        bearer_methods_supported: ["header"]}`. Served only while
        `[mcp] remote_enabled` is on and `[auth] hub_issuer` is set;
        otherwise 404.
      tags: [functions]
      security: []
      responses:
        '200':
          description: The document.
        '404':
          description: Remote MCP is off here.

  /.well-known/oauth-protected-resource/v1/mcp:
    get:
      operationId: functions_remote_mcp_resource_metadata_for_path
      summary: RFC 9728 protected-resource document, path form
      description: The same document, at the path RFC 9728 §3.1 derives from the resource `https://<fqdn>/v1/mcp`.
      tags: [functions]
      security: []
      responses:
        '200':
          description: The document.
        '404':
          description: Remote MCP is off here.

  /.well-known/oauth-protected-resource/v1:
    get:
      operationId: location_resource_metadata
      summary: RFC 9728 protected-resource document for this operator's /v1
      description: |
        SPEC-181 D-25 — `{resource: "https://<fqdn>/v1", authorization_servers:
        [<hub>], scopes_supported: ["location.read"],
        bearer_methods_supported: ["header"]}`: the narrow scopes this
        binary fences to the one route that asks for them. The hub reads it
        before minting a resource token for this operator. Served only with
        `[auth] hub_issuer` set and `[location] enabled` (and the location
        routes mounted); otherwise 404.
      tags: [location]
      security: []
      responses:
        '200':
          description: The document.
        '404':
          description: Not published here.

  /fn/{name}:
    get:
      operationId: functions_invoke_get
      summary: Invoke a hosted function (SPEC-088)
      description: |
        Runs the `Function` named `{name}` and returns whatever the guest
        answered. Any HTTP method is accepted; GET and POST are the two
        the contract names.

        Mounted only when `[functions].enabled` and the operator was
        built with the `functions` feature. A client discovers that from
        `features.functions_enabled` on `GET /v1/chat/clients/config` —
        probing this route cannot tell a disabled feature from a routing
        fault, because an unmounted path falls through to a 200 HTML
        page.

        The caller's device bearer authenticates the request and is then
        STRIPPED, with `cookie`, before the request crosses into the
        guest. Only a device attributed to the owner may invoke: a
        function acts with the owner's grants (`spec.capabilities`), so a
        sub-user or a surface is refused with 403.
      tags: [functions]
      security:
        - enrollmentAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The `metadata.name` of the applied `Function`.
          schema:
            type: string
      responses:
        '200':
          description: |
            The guest's response, verbatim. Any status the guest sets is
            passed through; `x-airdress-invocation-id` names the run for
            the operator log.
        '403':
          description: The device is not attributed to the owner.
        '404':
          description: |
            No enabled function is served at this name. Absent and
            `spec.enabled = false` are deliberately indistinguishable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body over the operator's inbound ceiling.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            The function is at its concurrency cap; `Retry-After` is set.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: |
            The guest ran past its deadline. Body is the runtime's
            diagnostic JSON.
    post:
      operationId: functions_invoke_post
      summary: Invoke a hosted function with a body (SPEC-088)
      description: |
        As `GET /fn/{name}`, with a request body the guest reads. The
        body is buffered up to `[functions].inbound_mib_max` and handed
        to the guest whole.
      tags: [functions]
      security:
        - enrollmentAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The `metadata.name` of the applied `Function`.
          schema:
            type: string
      requestBody:
        required: false
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The guest's response, verbatim.
        '403':
          description: The device is not attributed to the owner.
        '404':
          description: No enabled function is served at this name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body over the operator's inbound ceiling.
        '503':
          description: The function is at its concurrency cap.
        '504':
          description: The guest ran past its deadline.
  /v1/location/events:
    post:
      operationId: location_post_events
      summary: Report location events from the owner's phone
      description: |
        Chat SPEC-114 FR-24 — at most 50 events per request, each a zone
        transition, a fix or a sharing/consent state, identified by a
        client-generated UUIDv7. A retried batch is deduplicated on that id:
        the answer counts what was new (`accepted`) and what was already
        held (`duplicates`), and only new events are published.

        Validation is strict and all-or-nothing: an unknown field or word,
        a latitude or longitude out of range, or a zone label longer than
        64 characters refuses the whole batch with `invalid_event`, naming
        the field and never the value.

        A continuous track (chat SPEC-114 Stage D) arrives here too: its
        fixes as `kind: fix, origin: track` with a `track_id`, its start and
        end as `kind: track`. A track fix without `track_id` is refused with
        `track_id_missing`, a `track_id` on any other event with
        `track_id_unexpected`, and a malformed `track` object with
        `invalid_track` — each refusing the whole batch, as above.

        The device and principal come from the bearer, never the body.
        Refused with `403 location_disabled` while `[location].enabled` is
        false, `403 not_owner` for any principal but the owner, and
        `410 enrollment_revoked` for a revoked device, whatever the client
        believes.
      tags: [location]
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationEventBatch'
      responses:
        '200':
          description: Stored; new events published to the functions bound to location.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted:
                    type: integer
                  duplicates:
                    type: integer
        '400':
          description: '`invalid_request`, `invalid_event`, `track_id_missing`, `track_id_unexpected` or `invalid_track`, naming the field.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '401':
          description: No bearer, or one that never existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '403':
          description: '`location_disabled` or `not_owner`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '410':
          description: '`enrollment_revoked` — the phone tears its location state down.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '413':
          description: '`batch_too_large` — more than 50 events.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
    get:
      operationId: location_get_events
      summary: Read the operator's copy of location events
      description: |
        Chat SPEC-114 FR-24 — the stored events, opened, newest first: the
        calling device's own by default, or every device of the owner with
        `scope=all`. For the owner and for tooling; the app's "What was
        sent" view is its own on-device record, not this.

        `track_id` reads one continuous track: its fixes and its start and
        end. With it, and no `scope`, every device of the owner is read.

        SPEC-181 D-24 — also a hub access token for this operator's `/v1`
        carrying `location.read` (a resource token, minted by token
        exchange). It names no device, so it reads every device of the
        owner; `scope=device` is `400`. A member's token or another subject
        is `403 not_owner`, a revoked grant `401 grant_revoked`, and an
        access token without `location.read` (the CLI's)
        `403 insufficient_scope`. `POST` and `DELETE` take the device
        bearer only. A resource token reaches no other route: everywhere
        else it is `403 insufficient_scope` with
        `WWW-Authenticate: Bearer error="insufficient_scope"`.
      tags: [location]
      security:
        - ownerAuth: []
        - hubAccessToken: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [fix, zone, state, track]
        - name: track_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^trk_[!-~]{1,60}$'
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [device, all]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: '`invalid_request` — a malformed query value, such as a `track_id` that is not a track id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '403':
          description: '`location_disabled` or `not_owner`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '410':
          description: '`enrollment_revoked`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
    delete:
      operationId: location_delete_events
      summary: Delete what my airdress received
      description: |
        Chat SPEC-114 FR-27, FR-48 — erases every stored location event of
        the calling device, or of every device of the owner with
        `scope=all`, and answers the count erased.

        With `track_id`, only that continuous track goes — its fixes and its
        start and end — from every device of the owner unless
        `scope=device` narrows it to the calling one.
      tags: [location]
      security:
        - ownerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [device, all]
        - name: track_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^trk_[!-~]{1,60}$'
      responses:
        '200':
          description: Erased.
          content:
            application/json:
              schema:
                type: object
                required: [erased]
                properties:
                  erased:
                    type: integer
        '400':
          description: '`invalid_request` — a malformed query value, such as a `track_id` that is not a track id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '403':
          description: '`location_disabled` or `not_owner`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'
        '410':
          description: '`enrollment_revoked`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationError'

