# Release notes and the next version, from conventional commits (owner,
# 2026-11-03). Read by .github/workflows/release.yml through git-cliff (pinned
# in scripts/install-git-cliff.sh) and by scripts/check-release-version.sh.
#
# Bumps: feat → minor, fix and perf → patch, `!` or a BREAKING CHANGE footer
# → major. While the version is 0.x a breaking change bumps the MINOR, not to
# 1.0.0 (semver §4: anything may change before 1.0), so leaving 0.x is a
# deliberate act, not a side effect of a footer. Commits of any other type
# (chore, docs, ci, test, style, refactor, build) are not releasable: alone,
# they make no release. No tag yet → v0.1.0.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { body = ".*BREAKING CHANGE.*", group = "<!-- 3 -->Breaking changes" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
