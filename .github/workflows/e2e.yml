# End-to-end (SPEC-184 184-D.13): the console in Chromium, Firefox and WebKit
# against a real airdress-operator (the release the API is pinned to, fetched
# and checksummed by e2e/fetch-operator.sh) and a stand-in for the hub's
# authorization server. About three minutes, most of it installing browsers,
# so it is opt-in rather than on every push: dispatch it, or put the `e2e`
# label on a pull request. No schedule (owner, 2026-10-31).
name: e2e

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: the operator release the API is pinned to
        run: echo "AIRDRESS_OPERATOR_BIN=$(sh e2e/fetch-operator.sh)" >> "$GITHUB_ENV"
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
